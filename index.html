      extend: {
        colors: {

    background:

  .star:active { transform: scale(.85); }
  .star svg { fill: transparent; stroke: rgb(var(--star-off)); transition: fill .2s, stroke .2s; }
  .star.on svg { fill: rgb(var(--gold-500)); stroke: rgb(var(--gold-500)); filter: drop-shadow(0 0 8px rgb(var(--gold-500) / .55)); }
  .pop { animation: pop .35s cubic-bezier(.2,1.4,.4,1); }
  @keyframes pop { from { transform: scale(.6); } to { transform: scale(1); } }
  .fade-up { animation: fadeUp .35s ease both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .chip { transition: all .15s ease; -webkit-tap-highlight-color: transparent; }
  .chip[aria-pressed="true"] { background: rgb(var(--gold-500) / .16); border-color: rgb(var(--gold-500)); color: rgb(var(--gold-300)); }

  .glow-strong { box-shadow: 0 8px 30px rgb(var(--gold-500) / .35); }
  .card-shadow { box-shadow: 0 10px 30px rgb(0 0 0 / .25); }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

function getTableFromUrl() {
  return new URLSearchParams(window.location.search).get('table') || '1';
}

function switchTab(tab) {
  state.activeTab = tab;
  const isMenu = tab === 'menu';
  document.getElementById('viewMenu').classList.toggle('hidden', !isMenu);
  document.getElementById('viewReview').classList.toggle('hidden', !isMenu ? false : true);

  const btnMenu = document.getElementById('tabMenu');
  const btnRev = document.getElementById('tabReview');
  btnMenu.className = `flex items-center justify-center gap-2 rounded-xl py-3 text-sm font-bold transition ${isMenu ? 'bg-gold-500 text-on shadow-md' : 'text-fg/60'}`;
  btnRev.className = `flex items-center justify-center gap-2 rounded-xl py-3 text-sm font-bold transition ${!isMenu ? 'bg-gold-500 text-on shadow-md' : 'text-fg/60'}`;

  updateCartBar();
}

    const active = state.activeCat === key;
    const b = document.createElement('button');
    b.type = 'button';
    b.className = `whitespace-nowrap rounded-full border px-4 py-2 text-xs font-bold transition ${active ? 'border-gold-500 bg-gold-500/20 text-gold-300' : 'border-ink-700 bg-ink-900/90 text-fg/70 shadow-sm'}`;
    b.textContent = label;
    b.onclick = () => { state.activeCat = key; renderCategories(); renderMenu(); };
    wrap.appendChild(b);
  });
}

function renderMenu() {
  const list = document.getElementById('menuList');
  list.innerHTML = '';
  const items = MENU_ITEMS.filter(i => state.activeCat === 'all' || i.cat === state.activeCat);
  const L = t();

  items.forEach(item => {
    const qty = state.cart[item.id] || 0;
    const card = document.createElement('div');
    card.className = 'card-shadow overflow-hidden rounded-3xl border border-ink-700 bg-ink-900/90 backdrop-blur';
    card.innerHTML = `
      <div class="relative h-40 w-full overflow-hidden bg-ink-800">
        <img src="${item.image}" alt="${item.name.en}" class="h-full w-full object-cover transition duration-500 hover:scale-105" />
        <div class="absolute inset-0 bg-gradient-to-t from-ink-950 via-transparent to-transparent opacity-80"></div>
        <span class="absolute bottom-3 start-3 rounded-xl bg-ink-950/80 px-3 py-1 text-xs font-extrabold text-gold-300 backdrop-blur border border-gold-500/30">
          ${item.price} ${CONFIG.currency}
        </span>
      </div>
      <div class="p-4">
        <h3 class="text-base font-bold text-fg">${item.name[state.lang]}</h3>
        <p class="mt-1 text-xs leading-relaxed text-fg/60">${item.desc[state.lang]}</p>
        
        <div class="mt-2 text-[11px] text-fg/75 bg-ink-800/60 rounded-xl p-2 border border-ink-700/60">
          <strong class="text-gold-300">${L.ingredientsLabel}</strong> ${item.ingredients[state.lang]}
        </div>

        <div class="mt-2.5 flex flex-wrap gap-1.5 text-[10px] font-semibold">
          <span class="rounded-lg bg-ink-800 px-2 py-1 text-gold-300">⚡ ${item.kcal} ${L.kcal}</span>
          <span class="rounded-lg bg-ink-800 px-2 py-1 text-emerald-400">🥩 ${item.protein}g ${L.protein}</span>
          <span class="rounded-lg px-2 py-1 ${item.diabetesSafe ? 'bg-emerald-500/15 text-emerald-300 border border-emerald-500/30' : 'bg-rose-500/15 text-rose-300 border border-rose-500/30'}">${item.diabetesSafe ? L.diabetesYes : L.diabetesNo}</span>
          <span class="rounded-lg px-2 py-1 ${item.lowCholesterol ? 'bg-sky-500/15 text-sky-300 border border-sky-500/30' : 'bg-rose-500/15 text-rose-300 border border-rose-500/30'}">${item.lowCholesterol ? L.cholesterolYes : L.cholesterolNo}</span>
        </div>

        <div class="mt-4 flex items-center justify-between border-t border-ink-800 pt-3">
          <span class="text-xs font-bold text-gold-300">${item.name.en}</span>
          ${qty === 0 ? `
            <button onclick="updateQty(${item.id}, 1)" class="rounded-xl border border-gold-500/60 bg-gold-500/20 px-4 py-2 text-xs font-bold text-gold-300 active:scale-95 shadow">
              + ${L.add}
            </button>
          ` : `
            <div class="flex items-center gap-3 rounded-xl border border-gold-500 bg-ink-800 px-3 py-1.5">
              <button onclick="updateQty(${item.id}, -1)" class="text-sm font-bold text-gold-300">-</button>
              <span class="text-sm font-extrabold text-fg">${qty}</span>
              <button onclick="updateQty(${item.id}, 1)" class="text-sm font-bold text-gold-300">+</button>
            </div>
          `}
        </div>
      </div>
    `;
    list.appendChild(card);
  });
}

function updateQty(id, delta) {
  const next = (state.cart[id] || 0) + delta;
  if (next <= 0) delete state.cart[id];
  else state.cart[id] = next;
  renderMenu();
  updateCartBar();
}

function updateCartBar() {
  const entries = Object.entries(state.cart);
  const totalQty = entries.reduce((sum, [, q]) => sum + q, 0);
  const totalPrice = entries.reduce((sum, [id, q]) => {
    const item = MENU_ITEMS.find(i => i.id === Number(id));
    return sum + (item ? item.price * q : 0);
  }, 0);

  const bar = document.getElementById('cartBar');
  bar.classList.toggle('hidden', totalQty === 0 || state.activeTab !== 'menu');
  document.getElementById('cartCount').textContent = totalQty;
  document.getElementById('cartTotal').textContent = `${totalPrice} ${CONFIG.currency}`;
}

function openOrderModal() {
  const table = getTableFromUrl();
  const entries = Object.entries(state.cart);
  if (!entries.length) return;

  let total = 0;
  const qrLines = [`TABLE: ${table}`, `ORDER:`];
  const summaryHtml = [];

  entries.forEach(([id, qty]) => {
    const item = MENU_ITEMS.find(i => i.id === Number(id));
    if (!item) return;
    const sub = item.price * qty;
    total += sub;
    qrLines.push(`${qty}x ${item.name.en} (${sub}${CONFIG.currency})`);
    summaryHtml.push(`
      <div class="flex justify-between">
        <span class="text-fg/90"><strong>${qty}x</strong> ${item.name[state.lang]}</span>
        <span class="text-gold-300 font-semibold">${sub} ${CONFIG.currency}</span>
      </div>
    `);
  });

  qrLines.push(`TOTAL: ${total} ${CONFIG.currency}`);

  document.getElementById('modalTitle').textContent = `${t().modalTitle} #${table}`;
  document.getElementById('orderSummaryList').innerHTML = summaryHtml.join('');
  document.getElementById('modalTotalValue').textContent = `${total} ${CONFIG.currency}`;

  const qrContainer = document.getElementById('qrcode');
  qrContainer.innerHTML = '';
  new QRCode(qrContainer, {
    text: qrLines.join('\n'),
    width: 190,
    height: 190,
    colorDark: '#0b0b0d',
    colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.M
  });

  const modal = document.getElementById('qrModal');
  modal.classList.remove('hidden');
  modal.classList.add('flex');
}

function closeOrderModal() {
  const modal = document.getElementById('qrModal');
  modal.classList.add('hidden');
  modal.classList.remove('flex');
}

const starsEl = document.getElementById('stars');
const starSvg = '<svg viewBox="0 0 24 24" class="h-10 w-10" stroke-width="1.6"><path d="M12 2.5l2.9 6.1 6.6.9-4.8 4.6 1.2 6.6L12 17.5l-5.9 3.2 1.2-6.6L2.5 9.5l6.6-.9L12 2.5z"/></svg>';
for (let i = 1; i <= 5; i++) {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'star p-1';
  b.innerHTML = starSvg;
  b.onclick = () => {
    state.rating = i;
    [...starsEl.children].forEach((el, idx) => el.classList.toggle('on', idx + 1 <= i));
    document.getElementById('ratingLabel').textContent = t().ratings[i];
    document.getElementById('positive').classList.toggle('hidden', i < 4);
    document.getElementById('negative').classList.toggle('hidden', i >= 4);
  };
  starsEl.appendChild(b);
}

function renderChips() {
  const wrap = document.getElementById('chips');
  wrap.innerHTML = '';
  Object.entries(t().chips).forEach(([k, label]) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip rounded-full border border-ink-600 bg-ink-800 px-3 py-1.5 text-xs font-semibold text-fg/80';
    b.textContent = label;
    b.setAttribute('aria-pressed', String(state.tags.has(k)));
    b.onclick = () => {
      state.tags.has(k) ? state.tags.delete(k) : state.tags.add(k);
      b.setAttribute('aria-pressed', String(state.tags.has(k)));
    };
    wrap.appendChild(b);
  });
}

document.getElementById('waBtn').onclick = () => {
  const L = t();
  const tags = [...state.tags].map(k => '• ' + L.chips[k]).join('\n') || L.msg.none;
  const waiter = document.getElementById('waiterSelect').value || L.msg.none;
  const comment = document.getElementById('comment').value.trim() || L.msg.none;
  const lines = [
    L.msg.head,
    `🪑 ${L.msg.table}: ${getTableFromUrl()}`,
    `👤 ${L.msg.waiter}: ${waiter}`,
    `⭐ ${L.msg.rating}: ${state.rating}/5`,
    `⚠️ ${L.msg.issues}:\n${tags}`,
    `💬 ${L.msg.comment}: ${comment}`
  ];
  window.open(`https://wa.me/${CONFIG.whatsappNumber}?text=${encodeURIComponent(lines.join('\n'))}`, '_blank');
};

function applyLang(lang) {
  state.lang = lang;
  const L = t();
  document.documentElement.lang = L.lang;
  document.documentElement.dir = L.dir;

  document.getElementById('restName').textContent = CONFIG.restaurantName[lang];
  document.getElementById('headerTable').textContent = `T-${getTableFromUrl()}`;
  document.getElementById('liveDate').textContent = new Date().toLocaleDateString(L.locale, { day: 'numeric', month: 'short' });

  document.getElementById('tabMenuLabel').textContent = L.tabMenu;
  document.getElementById('tabReviewLabel').textContent = L.tabReview;
  document.getElementById('showQrBtnText').textContent = L.showQr;
  document.getElementById('modalHint').textContent = L.modalHint;
  document.getElementById('modalTotalLabel').textContent = L.modalTotal;

  document.getElementById('title').textContent = L.title;
  document.getElementById('subtitle').textContent = L.subtitle;
  document.getElementById('waiterLabel').textContent = L.waiterLabel;
  document.getElementById('waiterPlaceholder').textContent = L.waiterPlaceholder;
  document.getElementById('posTitle').textContent = L.posTitle;
  document.getElementById('posText').textContent = L.posText;
  document.getElementById('mapsLabel').textContent = L.mapsBtn;
  document.getElementById('mapsBtn').href = CONFIG.googleMapsReviewUrl;
  document.getElementById('negTitle').textContent = L.negTitle;
  document.getElementById('negText').textContent = L.negText;
  document.getElementById('chipsLabel').textContent = L.chipsLabel;
  document.getElementById('commentLabel').textContent = L.commentLabel;
  document.getElementById('waLabel').textContent = L.waBtn;
  document.getElementById('poweredBy').textContent = L.poweredBy + ' ';

  document.querySelectorAll('#langSwitch button').forEach(b => {
    const on = b.dataset.lang === lang;
    b.classList.toggle('bg-gold-500', on);
    b.classList.toggle('text-on', on);
    b.classList.toggle('text-fg/60', !on);
  });

  renderCategories();
  renderMenu();
  renderChips();
  updateCartBar();
}

document.querySelectorAll('#langSwitch button').forEach(b => b.onclick = () => applyLang(b.dataset.lang));

applyLang('ar');
switchTab('menu');
</script>
</body>
</html>
