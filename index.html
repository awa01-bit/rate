<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1a1113" />
<title>Ikatna – Menu & Reviews</title>

<!-- Fonts: Playfair Display, Cairo, Inter, Bitcount Single -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bitcount+Single:wght@100..900&family=Cairo:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet" />

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          morocco: {
            terra: '#803427',
            clay: '#471e17',
            dark: '#1a1113',
            surface: '#26181b',
            card: '#332125'
          },
          gold: { 300: '#f7e4a8', 400: '#e5c464', 500: '#d4af37', 600: '#b8932a' }
        },
        fontFamily: {
          display: ['"Playfair Display"', 'Cairo', 'serif'],
          body: ['Inter', 'Cairo', 'system-ui', 'sans-serif']
        }
      }
    }
  };
</script>

<style>
  html { scroll-behavior: smooth; }
  
  /* ---------- High-End Artistic Lounge Background ---------- */
  body {
    background-color: #1a1113 !important;
    background-image: 
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(196, 75, 54, 0.40) 0%, transparent 65%),
      radial-gradient(circle at 0% 90%, rgba(128, 52, 39, 0.30) 0%, transparent 55%),
      radial-gradient(circle at 100% 80%, rgba(0, 98, 51, 0.15) 0%, transparent 50%),
      linear-gradient(180deg, #28171a 0%, #1a1113 50%, #100a0b 100%) !important;
    background-attachment: fixed;
  }

  html[lang="ar"] body { font-family: 'Cairo', sans-serif; }
  html[lang="fr"] body, html[lang="en"] body { font-family: 'Inter', sans-serif; }

  .font-display { font-family: 'Playfair Display', 'Cairo', serif; }
  .no-scrollbar { scrollbar-width: none; }
  .no-scrollbar::-webkit-scrollbar { display: none; }

  /* ---------- Modern Frosted Glass ---------- */
  .glass {
    background: rgba(51, 33, 37, 0.52);
    border: 1px solid rgba(247, 228, 168, 0.14);
    -webkit-backdrop-filter: blur(20px);
            backdrop-filter: blur(20px);
  }
  .glass-strong {
    background: rgba(38, 24, 27, 0.90);
    border: 1px solid rgba(212, 175, 55, 0.38);
    -webkit-backdrop-filter: blur(26px);
            backdrop-filter: blur(26px);
  }
  .nav-glass {
    background: rgba(26, 17, 19, 0.85);
    border-bottom: 1px solid rgba(247, 228, 168, 0.12);
    -webkit-backdrop-filter: blur(20px);
            backdrop-filter: blur(20px);
  }

  /* ---------- Gold Text & Buttons ---------- */
  .gold-text {
    background: linear-gradient(110deg, #d4af37 0%, #fff1b8 40%, #e5c464 60%, #f7e4a8 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 2px 12px rgba(212,175,55,0.22));
  }
  .btn-gold {
    background: linear-gradient(110deg, #d4af37 0%, #f7e4a8 45%, #d4af37 90%);
    color: #1a1113; font-weight: 800;
    box-shadow: 0 4px 15px rgba(212,175,55,0.3);
    transition: transform .15s ease, box-shadow .2s ease;
  }
  .btn-gold:active { transform: scale(.97); }
  .btn-gold:hover  { box-shadow: 0 6px 22px rgba(212,175,55,0.45); }

  .brand-font { font-family: 'Bitcount Single', 'Inter', monospace; font-weight: 600; letter-spacing: .12em; }

  button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible {
    outline: 2px solid #d4af37; outline-offset: 2px;
  }

  .lang-on { background: #d4af37; color: #1a1113; }
  .tab-on  { background: linear-gradient(110deg,#d4af37,#f7e4a8); color: #1a1113; box-shadow: 0 6px 20px rgba(212,175,55,0.3); }
  .pill { border: 1px solid rgba(247,228,168,.18); color: rgba(255,255,255,.85); background: rgba(51,33,37,.65); transition: all .18s ease; }
  .pill[aria-pressed="true"] { background: rgba(212,175,55,.22); border-color: #d4af37; color: #f7e4a8; }

  .dish { transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease; background: rgba(38,24,27,0.65); }
  .dish:hover { transform: translateY(-3px); border-color: rgba(212,175,55,0.45); box-shadow: 0 20px 45px rgba(0,0,0,0.55); }
  .badge { display: inline-flex; align-items: center; gap: .3rem; border-radius: 9999px; padding: .15rem .5rem; font-size: .7rem; font-weight: 600;
           border: 1px solid rgba(247,228,168,.15); color: rgba(255,255,255,.9); background: rgba(255,255,255,.07); white-space: nowrap; }
  .badge-ok    { border-color: rgba(52,211,153,.45);  color: #6ee7b7; background: rgba(52,211,153,.15); }
  .badge-heart { border-color: rgba(251,113,133,.45); color: #fda4af; background: rgba(251,113,133,.15); }
  details > summary { list-style: none; cursor: pointer; }
  details > summary::-webkit-details-marker { display: none; }
  details[open] .chev { transform: rotate(180deg); }
  .chev { transition: transform .2s ease; }

  .star { transition: transform .15s ease; -webkit-tap-highlight-color: transparent; }
  .star:active { transform: scale(.85); }
  .star svg { fill: transparent; stroke: #9e8a8d; transition: fill .2s, stroke .2s; }
  .star.on svg { fill: #d4af37; stroke: #d4af37; filter: drop-shadow(0 0 10px rgba(212,175,55,0.6)); }

  .chip { border: 1px solid #5e3b40; background: #332125; color: rgba(255,255,255,.9); transition: all .15s ease; -webkit-tap-highlight-color: transparent; }
  .chip[aria-pressed="true"] { background: rgba(212,175,55,.22); border-color: #d4af37; color: #f7e4a8; }

  .pop { animation: pop .35s cubic-bezier(.2,1.4,.4,1); }
  @keyframes pop { from { transform: scale(.6); } to { transform: scale(1); } }
  .fade-up { animation: fadeUp .45s ease both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  #qrBox img { max-width: 100%; height: auto; margin: 0 auto; display: block; border-radius: 0.5rem; }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>

<body class="min-h-screen text-white antialiased">
<div class="fixed inset-x-0 top-0 z-50 h-[3px]" aria-hidden="true" style="background:linear-gradient(90deg,#803427 0%,#d4af37 50%,#006233 100%)"></div>

<!-- HEADER -->
<header class="mx-auto flex max-w-6xl items-center justify-between px-5 pb-1 pt-[max(1rem,env(safe-area-inset-top))]">
  <span class="brand-font text-[12px] text-gold-400" dir="ltr" aria-label="Ikatna"><span class="text-white">I</span>k<span class="text-white">at</span>na</span>

  <div id="langSwitch" class="inline-flex rounded-full border border-white/20 bg-[#332125]/80 p-1 text-xs font-semibold backdrop-blur" role="group" aria-label="Language">
    <button data-lang="ar" class="rounded-full px-3 py-1.5 transition">عربي</button>
    <button data-lang="fr" class="rounded-full px-3 py-1.5 transition">FR</button>
    <button data-lang="en" class="rounded-full px-3 py-1.5 transition">EN</button>
  </div>
</header>

<!-- HERO -->
<section class="mx-auto max-w-6xl px-5 pb-5 pt-5 text-center fade-up">
  <div class="mx-auto mb-3 flex items-center justify-center gap-3 text-gold-400" aria-hidden="true">
    <span class="h-px w-10 bg-gradient-to-r from-transparent to-gold-500/70"></span>
    <svg viewBox="0 0 48 48" class="h-9 w-9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 36h42M8 36a16 16 0 0 1 32 0M24 20v-4M21 16h6M2 40h44"/></svg>
    <span class="h-px w-10 bg-gradient-to-l from-transparent to-gold-500/70"></span>
  </div>
  <p data-i18n="welcome" class="text-xs font-semibold uppercase tracking-[.3em] text-gold-300/90"></p>
  <h1 id="restName" class="gold-text mt-2 font-display text-4xl font-extrabold leading-tight sm:text-5xl"></h1>
  <p data-i18n="tagline" class="mx-auto mt-2 max-w-md text-sm text-white/85"></p>

  <div class="glass mt-5 inline-flex items-center gap-3 rounded-full py-2 ps-4 pe-2.5">
    <span class="flex h-7 w-7 items-center justify-center rounded-full bg-gold-500/25 text-gold-300">
      <svg viewBox="0 0 24 24" class="h-3.5 w-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10h18M5 10v10M19 10v10M2 6h20"/></svg>
    </span>
    <span data-i18n="table" class="text-xs font-semibold uppercase tracking-widest text-white/80"></span>
    <span id="tableNum" class="font-display text-xl font-bold text-gold-300" dir="ltr">—</span>
    <button id="tableEditBtn" type="button" class="flex h-7 w-7 items-center justify-center rounded-full bg-white/10 text-white/85 transition hover:bg-white/20 hover:text-gold-300">
      <svg viewBox="0 0 24 24" class="h-3.5 w-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
    </button>
  </div>

  <div id="tableForm" class="mx-auto mt-3 hidden max-w-xs" role="group" aria-labelledby="tableFormLabel">
    <label id="tableFormLabel" for="tableInput" class="block text-xs font-semibold text-amber-300/90"></label>
    <div class="mt-2 flex gap-2">
      <input id="tableInput" type="text" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false" dir="ltr"
             class="min-w-0 flex-1 rounded-2xl border border-[#5e3b40] bg-[#332125] p-3 text-center font-display text-xl font-bold uppercase tracking-widest text-white placeholder:text-white/40 focus:border-gold-500" />
      <button id="tableOkBtn" type="button" data-i18n="tableOk" class="btn-gold rounded-2xl px-5 text-sm"></button>
    </div>
    <p id="tableErr" class="mt-2 hidden text-xs text-red-400" role="alert"></p>
  </div>
</section>

<!-- STICKY NAV -->
<div class="nav-glass sticky top-0 z-30">
  <div class="mx-auto max-w-6xl px-5 pb-2 pt-2.5">
    <div class="glass grid grid-cols-2 gap-1 rounded-full p-1" role="tablist">
      <button id="tabBtnMenu"   role="tab" aria-selected="true"  aria-controls="panelMenu"   class="rounded-full px-4 py-2 text-sm font-bold transition" data-i18n="tabMenu"></button>
      <button id="tabBtnReview" role="tab" aria-selected="false" aria-controls="panelReview" class="rounded-full px-4 py-2 text-sm font-bold transition" data-i18n="tabReview"></button>
    </div>
    <div id="pills" class="no-scrollbar -mx-5 mt-2 flex gap-2 overflow-x-auto px-5 pb-1" role="group"></div>
  </div>
</div>

<!-- MENU TAB -->
<main id="panelMenu" role="tabpanel" class="mx-auto max-w-6xl px-5 pb-28 pt-5">
  <div id="menuRoot"></div>
  <p data-i18n="nutriNote" class="mx-auto mt-8 max-w-lg text-center text-xs leading-relaxed text-white/70"></p>
</main>

<!-- REVIEW TAB -->
<main id="panelReview" role="tabpanel" class="mx-auto hidden max-w-xl px-5 pb-16 pt-5">
  <div id="reviewLocked" class="glass hidden rounded-3xl p-6 text-center">
    <div class="pop mx-auto mb-3 flex h-12 w-12 items-center justify-center rounded-full bg-gold-500/20 text-2xl">🙏</div>
    <h2 data-i18n="lockedTitle" class="text-lg font-bold"></h2>
    <p data-i18n="lockedText" class="mt-2 text-xs leading-relaxed text-white/80"></p>
  </div>

  <div id="reviewFlow">
    <div class="glass rounded-3xl p-4">
      <h2 data-i18n="reviewTitle" class="text-center font-display text-xl font-bold"></h2>
      <p data-i18n="reviewSub" class="mt-1 text-center text-xs text-white/80"></p>

      <label for="waiterName" data-i18n="waiterLabel" class="mt-4 block text-xs font-semibold uppercase tracking-wider text-gold-300"></label>
      <input id="waiterName" type="text" maxlength="40" autocomplete="off"
             class="mt-1.5 w-full rounded-xl border border-[#5e3b40] bg-[#332125] p-3 text-xs text-white placeholder:text-white/40 focus:border-gold-500" />

      <div id="stars" class="mt-5 flex justify-center gap-1.5" dir="ltr" role="radiogroup" aria-label="Rating"></div>
      <p id="ratingLabel" class="mt-2.5 h-5 text-center text-xs font-semibold text-gold-300"></p>
    </div>

    <section id="positive" class="mt-4 hidden rounded-3xl border border-gold-500/40 bg-gradient-to-b from-gold-500/20 to-[#1a1113]/60 p-5 text-center backdrop-blur">
      <div class="pop mx-auto mb-2.5 flex h-12 w-12 items-center justify-center rounded-full bg-gold-500/25 text-2xl">🎉</div>
      <h2 data-i18n="posTitle" class="text-lg font-bold"></h2>
      <p data-i18n="posText" class="mt-1.5 text-xs leading-relaxed text-white/85"></p>
      <a id="mapsBtn" href="#" target="_blank" rel="noopener noreferrer"
         class="btn-gold mt-4 flex w-full items-center justify-center gap-2 rounded-xl px-4 py-3 text-sm">
        <svg viewBox="0 0 24 24" class="h-4 w-4" fill="currentColor" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
        <span data-i18n="mapsBtn"></span>
      </a>
    </section>

    <section id="negative" class="glass mt-4 hidden rounded-3xl p-4">
      <h2 data-i18n="negTitle" class="text-base font-bold"></h2>
      <p data-i18n="negText" class="mt-1 text-xs leading-relaxed text-white/80"></p>

      <p data-i18n="chipsLabel" class="mt-4 text-xs font-semibold uppercase tracking-wider text-gold-300"></p>
      <div id="chips" class="mt-2 flex flex-wrap gap-1.5"></div>

      <label for="comment" data-i18n="commentLabel" class="mt-4 block text-xs font-semibold uppercase tracking-wider text-gold-300"></label>
      <textarea id="comment" rows="3" maxlength="600"
        class="mt-1.5 w-full resize-none rounded-xl border border-[#5e3b40] bg-[#332125] p-3 text-xs text-white placeholder:text-white/40 focus:border-gold-500"></textarea>

      <button id="waBtn" type="button"
        class="mt-4 flex w-full items-center justify-center gap-2 rounded-xl bg-[#25D366] px-4 py-3 text-sm font-extrabold text-[#1a1113] shadow-[0_6px_20px_rgba(37,211,102,.3)] transition active:scale-[.98]">
        <svg viewBox="0 0 24 24" class="h-4 w-4" fill="currentColor" aria-hidden="true"><path d="M12.04 2a9.9 9.9 0 0 0-8.47 15l-1.5 5.5 5.64-1.48A9.9 9.9 0 1 0 12.04 2zm5.8 14.1c-.25.7-1.45 1.34-2 1.4-.5.06-1.13.09-1.82-.12-.42-.13-.96-.31-1.65-.6-2.9-1.25-4.8-4.17-4.94-4.37-.14-.19-1.18-1.57-1.18-3s.75-2.13 1.02-2.42c.27-.29.58-.36.78-.36h.56c.18 0 .42-.07.65.5.25.58.84 2.02.91 2.17.07.14.12.31.02.5-.1.2-.15.31-.3.48-.14.17-.3.38-.43.51-.14.14-.29.3-.12.58.17.29.75 1.24 1.62 2.01 1.1.98 2.03 1.29 2.32 1.43.29.14.46.12.63-.07.17-.2.72-.84.91-1.13.2-.29.38-.24.65-.14.27.1 1.7.8 2 .95.29.14.48.22.55.34.07.12.07.7-.18 1.4z"/></svg>
        <span data-i18n="waBtn"></span>
      </button>
      <p data-i18n="waHint" class="mt-2.5 text-center text-[11px] text-white/60"></p>

      <a id="publicLink" href="#" target="_blank" rel="noopener noreferrer"
         data-i18n="publicLink" class="mt-3 block text-center text-xs text-white/70 underline underline-offset-4 hover:text-gold-300"></a>
    </section>
  </div>
</main>

<!-- FOOTER -->
<footer class="mx-auto max-w-6xl px-5 pb-24 pt-4 text-center">
  <div class="mx-auto mb-2 h-px w-12 bg-gradient-to-r from-transparent via-gold-500/70 to-transparent"></div>
  <p class="text-[11px] text-white/65">
    <span data-i18n="poweredBy"></span>
    <span class="brand-font text-[11px] text-gold-400" dir="ltr"><span class="text-white">I</span>k<span class="text-white">at</span>na</span>
  </p>
</footer>

<!-- STICKY CART BAR (COMPACT & SLEEK) -->
<div id="cartBar" class="pointer-events-none fixed inset-x-0 bottom-0 z-40 translate-y-full px-3 pb-[max(.5rem,env(safe-area-inset-bottom))] transition-transform duration-300" aria-hidden="true">
  <div class="glass-strong mx-auto flex max-w-md items-center justify-between gap-2.5 rounded-2xl px-3 py-2 shadow-[0_-8px_30px_rgba(0,0,0,.6)]">
    <div id="cartInfo" class="min-w-0 flex-1 ps-1">
      <p id="cartCount" class="text-[10px] font-semibold uppercase tracking-wider text-white/80 leading-tight"></p>
      <p id="cartTotal" class="font-display text-base font-bold text-gold-300 leading-tight"></p>
    </div>
    <button id="cancelBtn" type="button" class="ms-auto flex h-9 shrink-0 items-center gap-1 rounded-xl border border-white/15 bg-white/5 px-2.5 text-xs font-bold text-white/90 transition hover:bg-white/10">
      <svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/></svg>
      <span id="cancelLabel" class="hidden"></span>
    </button>
    <button id="qrBtn" type="button" class="btn-gold flex shrink-0 items-center gap-1.5 rounded-xl px-3.5 py-2 text-xs">
      <svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h3M20 17v4"/></svg>
      <span data-i18n="showQr"></span>
    </button>
  </div>
</div>

<!-- QR MODAL -->
<div id="qrModal" class="fixed inset-0 z-50 hidden items-end justify-center bg-black/75 backdrop-blur-sm sm:items-center" role="dialog" aria-modal="true" aria-labelledby="qrTitle">
  <div class="glass-strong fade-up max-h-[90vh] w-full max-w-sm overflow-y-auto rounded-t-3xl p-5 sm:rounded-3xl">
    <div class="text-center">
      <h2 id="qrTitle" data-i18n="qrTitle" class="font-display text-xl font-bold"></h2>
      <p class="mt-0.5 text-xs text-white/80">
        <span data-i18n="table"></span>
        <span id="qrTable" class="font-bold text-gold-300" dir="ltr"></span>
        <span class="mx-1 text-white/30">·</span>
        <span id="qrRef" class="font-mono text-[11px] tracking-widest text-white/70" dir="ltr"></span>
      </p>
    </div>

    <div class="mx-auto mt-4 w-fit rounded-2xl bg-white p-3 shadow-[0_0_30px_rgba(212,175,55,.3)]">
      <div id="qrBox" class="flex h-[180px] w-[180px] items-center justify-center" dir="ltr"></div>
    </div>
    <p id="qrError" class="mt-2.5 hidden text-center text-xs text-amber-300"></p>
    <p data-i18n="qrHint" class="mt-2.5 text-center text-[11px] text-white/75"></p>

    <ul id="qrList" class="mt-4 space-y-1.5 border-t border-white/10 pt-3 text-xs"></ul>
    <div class="mt-2.5 flex items-center justify-between border-t border-white/10 pt-2.5">
      <span data-i18n="total" class="text-xs font-semibold text-white/85"></span>
      <span id="qrTotal" class="font-display text-base font-bold text-gold-300"></span>
    </div>

    <button id="qrCancel" type="button"
      class="mt-4 w-full rounded-xl border border-red-400/40 bg-red-500/10 px-4 py-3 text-xs font-bold text-red-300 transition hover:bg-red-500/20"></button>
    <button id="qrClose" type="button" data-i18n="close"
      class="mt-2.5 w-full rounded-xl border border-white/15 bg-white/5 px-4 py-3 text-xs font-bold transition hover:bg-white/10"></button>
  </div>
</div>

<script>

  function getTableFromUrl() {
    try {
      const p = new URLSearchParams(window.location.search);
      const val = p.get('table');
      if (val) {
        const clean = val.trim().toUpperCase().replace(/[^A-Z0-9_-]/g, '').slice(0, 6);
        if (clean) return clean;
      }
    } catch (_) {}
    return '';
  }

      state.table = fromUrl;
      hideTableForm();
    } else {
      try {
        const saved = localStorage.getItem('ikatna_table');
        if (saved) {
          state.table = saved;
          hideTableForm();
          return;
        }
      } catch (_) {}
      state.table = '';
      showTableForm();
    }
    updateTableUI();
  }

  function showTableForm() {
    const box = document.getElementById('tableForm');
    if (box) box.classList.remove('hidden');
    const input = document.getElementById('tableInput');
    if (input) input.focus();
  }

  function hideTableForm() {
    const box = document.getElementById('tableForm');
    if (box) box.classList.add('hidden');
  }

  function updateTableUI() {
    const numEl = document.getElementById('tableNum');
    if (numEl) numEl.textContent = state.table || '—';
    const qrT = document.getElementById('qrTable');
    if (qrT) qrT.textContent = state.table ? '#' + state.table : '—';
  }

  function setTable(val) {
    const clean = (val || '').trim().toUpperCase().replace(/[^A-Z0-9_-]/g, '').slice(0, 6);
    const errEl = document.getElementById('tableErr');
    if (!clean) {
      if (errEl) {
        errEl.textContent = state.lang === 'ar' ? 'الرجاء إدخال رقم الطاولة' : state.lang === 'fr' ? 'Veuillez entrer un numéro de table' : 'Please enter a table number';
        errEl.classList.remove('hidden');
      }
      return;
    }
    if (errEl) errEl.classList.add('hidden');
    state.table = clean;
    try { localStorage.setItem('ikatna_table', clean); } catch (_) {}
    hideTableForm();
    updateTableUI();
  }

  function getReviewLockKey() {
    return 'ikatna_reviewed_' + (state.table || 'GEN');
  }

  function checkReviewLock() {
    try {
      const raw = localStorage.getItem(getReviewLockKey());
      if (raw) {
        const ts = parseInt(raw, 10);
        const hours = (Date.now() - ts) / (1000 * 60 * 60);
        if (hours < CONFIG.reviewLockHours) return true;
      }
    } catch (_) {}
    return false;
  }

  function setReviewLock() {
    try { localStorage.setItem(getReviewLockKey(), String(Date.now())); } catch (_) {}
  }

  function updateReviewLockUI() {
    const locked = checkReviewLock();
    const lockedBox = document.getElementById('reviewLocked');
    const flowBox = document.getElementById('reviewFlow');
    if (lockedBox && flowBox) {
      lockedBox.classList.toggle('hidden', !locked);
      flowBox.classList.toggle('hidden', locked);
    }
  }

  function applyLanguage(lang) {
    if (!I18N[lang]) return;
    state.lang = lang;
    const L = I18N[lang];

    document.documentElement.lang = L.lang;
    document.documentElement.dir = L.dir;

    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (L[key]) el.textContent = L[key];
    });

    const rn = CONFIG.restaurantName[lang] || CONFIG.restaurantName.en;
    const rnEl = document.getElementById('restName');
    if (rnEl) rnEl.textContent = rn;

    const tIn = document.getElementById('tableInput');
    if (tIn) tIn.placeholder = lang === 'ar' ? 'مثلاً 01' : 'e.g. 01';

    document.querySelectorAll('#langSwitch button').forEach(b => {
      const active = b.getAttribute('data-lang') === lang;
      b.classList.toggle('lang-on', active);
      b.classList.toggle('text-white/80', !active);
    });

    const cancelLbl = document.getElementById('cancelLabel');
    if (cancelLbl) cancelLbl.textContent = L.cancelOrder;

    renderPills();
    renderMenu();
    renderChips();
    paintStars();
    updateCartBar();
  }

  function switchTab(tab) {
    state.tab = tab;
    const isMenu = tab === 'menu';
    const menuP = document.getElementById('panelMenu');
    const revP = document.getElementById('panelReview');
    const btnM = document.getElementById('tabBtnMenu');
    const btnR = document.getElementById('tabBtnReview');

    if (menuP) menuP.classList.toggle('hidden', !isMenu);
    if (revP) revP.classList.toggle('hidden', isMenu);

    if (btnM) {
      btnM.setAttribute('aria-selected', isMenu ? 'true' : 'false');
      btnM.className = `rounded-full px-4 py-2 text-sm font-bold transition ${isMenu ? 'tab-on' : 'text-white/85 hover:text-white'}`;
    }
    if (btnR) {
      btnR.setAttribute('aria-selected', !isMenu ? 'true' : 'false');
      btnR.className = `rounded-full px-4 py-2 text-sm font-bold transition ${!isMenu ? 'tab-on' : 'text-white/85 hover:text-white'}`;
    }

    updateCartBar();
    if (!isMenu) updateReviewLockUI();
  }

  function renderPills() {
    const wrap = document.getElementById('pills');
    if (!wrap) return;
    wrap.innerHTML = '';
    const cats = t().categories;

    Object.keys(cats).forEach(key => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'pill rounded-full px-3.5 py-1.5 text-xs font-semibold whitespace-nowrap';
      btn.textContent = cats[key];
      const active = state.cat === key;
      btn.setAttribute('aria-pressed', active ? 'true' : 'false');
      btn.onclick = () => {
        state.cat = key;
        renderPills();
        renderMenu();
      };
      wrap.appendChild(btn);
    });
  }

  function renderMenu() {
    const root = document.getElementById('menuRoot');
    if (!root) return;
    root.innerHTML = '';

    const list = MENU.filter(item => state.cat === 'all' || item.cat === state.cat);
    const L = t();

    if (list.length === 0) {
      root.innerHTML = '<p class="py-16 text-center text-sm text-white/50">No items found.</p>';
      return;
    }

    const grid = document.createElement('div');
    grid.className = 'grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3';

    list.forEach(item => {
      const data = item[state.lang] || item.en;
      const qty = state.cart[item.id] || 0;

      const card = document.createElement('article');
      card.className = 'dish glass overflow-hidden rounded-3xl flex flex-col justify-between';

      const imgHtml = `
        <div class="relative h-44 w-full overflow-hidden bg-[#26181b]">
          <img src="${IMG(item.img)}" alt="${escapeHtml(data.name)}" loading="lazy"
               class="h-full w-full object-cover transition duration-500 hover:scale-105"
               onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" />
          <div class="absolute inset-0 hidden items-center justify-center bg-[#26181b] text-gold-400 font-display text-lg font-bold">
            ${escapeHtml(data.name)}
          </div>
          <div class="absolute inset-0 bg-gradient-to-t from-[#1a1113]/95 via-[#1a1113]/25 to-transparent"></div>
          <span class="absolute bottom-2.5 start-3 rounded-full bg-[#1a1113]/90 px-3 py-0.5 text-xs font-extrabold text-gold-300 backdrop-blur border border-gold-500/40">
            ${item.price} ${CONFIG.currencyCode}
          </span>
        </div>
      `;

      let badgesHtml = `<span class="badge">⚡ ${item.kcal} ${L.kcal}</span><span class="badge">🥩 ${item.protein}g ${L.protein}</span>`;
      if (item.diabetic) badgesHtml += `<span class="badge badge-ok">✅ ${L.diabeticOk}</span>`;
      if (item.lowChol) badgesHtml += `<span class="badge badge-heart">💙 ${L.lowCholOk}</span>`;

      const ingList = (data.ing || []).join(', ');
      const detailsHtml = `
        <details class="mt-2.5 group">
          <summary class="flex items-center justify-between text-xs font-semibold text-gold-300/95 py-0.5">
            <span>${L.ingredients}</span>
            <svg viewBox="0 0 24 24" class="chev h-3.5 w-3.5 text-gold-300/80" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
          </summary>
          <p class="mt-1 text-[11px] leading-relaxed text-white/80 ps-1">${escapeHtml(ingList)}</p>
        </details>
      `;

      let actionHtml = '';
      if (qty === 0) {
        actionHtml = `
          <button type="button" onclick="window.__ikatna.add('${item.id}', 1)"
                  class="btn-gold w-full rounded-xl py-2.5 text-xs flex items-center justify-center gap-1.5">
            <svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
            <span>${L.add}</span>
          </button>
        `;
      } else {
        actionHtml = `
          <div class="flex items-center justify-between rounded-xl border border-gold-500/50 bg-gold-500/20 p-1">
            <button type="button" onclick="window.__ikatna.add('${item.id}', -1)"
                    class="flex h-8 w-8 items-center justify-center rounded-lg bg-white/10 font-bold text-gold-300 transition hover:bg-white/20" aria-label="Decrease">
              <svg viewBox="0 0 24 24" class="h-3.5 w-3.5" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14"/></svg>
            </button>
            <span class="font-display text-base font-extrabold text-gold-300 px-2" dir="ltr">${qty}</span>
            <button type="button" onclick="window.__ikatna.add('${item.id}', 1)"
                    class="flex h-8 w-8 items-center justify-center rounded-lg bg-white/10 font-bold text-gold-300 transition hover:bg-white/20" aria-label="Increase">
              <svg viewBox="0 0 24 24" class="h-3.5 w-3.5" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
            </button>
          </div>
        `;
      }

      card.innerHTML = `
        <div>
          ${imgHtml}
          <div class="p-4">
            <h3 class="font-display text-base font-bold text-white">${escapeHtml(data.name)}</h3>
            <p class="mt-1 text-xs leading-relaxed text-white/80">${escapeHtml(data.desc)}</p>
            <div class="mt-3 flex flex-wrap gap-1">${badgesHtml}</div>
            <div class="mt-2.5 border-t border-white/10 pt-1.5">${detailsHtml}</div>
          </div>
        </div>
        <div class="p-4 pt-0">${actionHtml}</div>
      `;
      grid.appendChild(card);
    });

    root.appendChild(grid);
  }

  function getCartSummary() {
    let totalQty = 0;
    let totalPrice = 0;
    const items = [];

    Object.keys(state.cart).forEach(id => {
      const q = state.cart[id];
      if (q > 0) {
        const item = MENU.find(m => m.id === id);
        if (item) {
          totalQty += q;
          totalPrice += item.price * q;
          items.push({ item, qty: q, sub: item.price * q });
        }
      }
    });
    return { totalQty, totalPrice, items };
  }

  function updateCartBar() {
    const bar = document.getElementById('cartBar');
    if (!bar) return;
    const { totalQty, totalPrice } = getCartSummary();
    const show = (totalQty > 0 && state.tab === 'menu');

    bar.classList.toggle('translate-y-full', !show);
    bar.classList.toggle('pointer-events-none', !show);
    bar.setAttribute('aria-hidden', show ? 'false' : 'true');

    if (show) {
      const countEl = document.getElementById('cartCount');
      const totalEl = document.getElementById('cartTotal');
      if (countEl) countEl.textContent = `${totalQty} ${totalQty === 1 ? (state.lang === 'ar' ? 'صنف' : 'item') : (state.lang === 'ar' ? 'أصناف' : 'items')}`;
      if (totalEl) totalEl.textContent = `${totalPrice} ${CONFIG.currencyCode}`;
    }
  }

  function modifyQty(id, delta) {
    const cur = state.cart[id] || 0;
    const next = cur + delta;
    if (next <= 0) delete state.cart[id];
    else state.cart[id] = next;
    state.cancelArmed = false;
    updateCancelButtonUI();
    renderMenu();
    updateCartBar();
  }

  function updateCancelButtonUI() {
    const btn = document.getElementById('cancelBtn');
    if (!btn) return;
    if (state.cancelArmed) {
      btn.className = 'ms-auto flex h-9 shrink-0 items-center gap-1 rounded-xl border border-red-500 bg-red-500/20 px-2.5 text-[11px] font-bold text-red-200 transition';
    } else {
      btn.className = 'ms-auto flex h-9 shrink-0 items-center gap-1 rounded-xl border border-white/15 bg-white/5 px-2.5 text-xs font-bold text-white/90 transition hover:bg-white/10';
    }
  }

  function clearCart() {
    state.cart = {};
    state.cancelArmed = false;
    updateCancelButtonUI();
    renderMenu();
    updateCartBar();
    closeQrModal();
  }

  function openQrModal() {
    const { totalQty, totalPrice, items } = getCartSummary();
    if (totalQty === 0) return;

    const modal = document.getElementById('qrModal');
    if (modal) {
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    const tableStr = state.table ? '#' + state.table : 'ANY';
    const refStr = 'ORD-' + Math.random().toString(36).substring(2, 8).toUpperCase();
    const qrRefEl = document.getElementById('qrRef');
    if (qrRefEl) qrRefEl.textContent = refStr;

    const listEl = document.getElementById('qrList');
    if (listEl) {
      listEl.innerHTML = items.map(({ item, qty, sub }) => `
        <li class="flex justify-between items-center py-1">
          <span class="text-white/95"><strong>${qty}x</strong> ${escapeHtml(item.nameAr)} / ${escapeHtml(item.nameFr)} / ${escapeHtml(item.nameEn)}</span>
          <span class="font-semibold text-gold-300" dir="ltr">${sub} ${CONFIG.currencyCode}</span>
        </li>
      `).join('');
    }

    const totalValEl = document.getElementById('qrTotal');
    if (totalValEl) totalValEl.textContent = `${totalPrice} ${CONFIG.currencyCode}`;

    const cancelBtn = document.getElementById('qrCancel');
    if (cancelBtn) cancelBtn.textContent = t().cancelOrder;

    const lines = [
      `IKATNA ORDER`,
      `TABLE: ${tableStr}`,
      `REF: ${refStr}`,
      `---`
    ];
    items.forEach(({ item, qty }) => {
      lines.push(`${qty}x ${item.nameAr} | ${item.nameFr} | ${item.nameEn} (${item.price * qty} ${CONFIG.currencyCode})`);
    });
    lines.push(`---`);
    lines.push(`TOTAL: ${totalPrice} ${CONFIG.currencyCode}`);

    const box = document.getElementById('qrBox');
    const errEl = document.getElementById('qrError');
    if (box) {
      box.innerHTML = '';
      if (errEl) errEl.classList.add('hidden');
      
      const qrText = encodeURIComponent(lines.join('\n'));
      const qrImageUrl = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${qrText}`;
      
      const img = document.createElement('img');
      img.src = qrImageUrl;
      img.alt = 'Order QR Code';
      img.onerror = () => {
        if (errEl) {
          errEl.textContent = 'Could not generate QR image. Please show order summary below.';
          errEl.classList.remove('hidden');
        }
      };
      box.appendChild(img);
    }
  }

  function closeQrModal() {
    const modal = document.getElementById('qrModal');
    if (modal) {
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }
  }

  function initReview() {
    const starsEl = document.getElementById('stars');
    if (!starsEl) return;
    starsEl.innerHTML = '';

    const starSvg = '<svg viewBox="0 0 24 24" class="h-10 w-10 sm:h-11 sm:w-11" stroke-width="1.6" stroke-linejoin="round"><path d="M12 2.5l2.9 6.1 6.6.9-4.8 4.6 1.2 6.6L12 17.5l-5.9 3.2 1.2-6.6L2.5 9.5l6.6-.9L12 2.5z"/></svg>';

    for (let i = 1; i <= 5; i++) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'star p-1';
      b.setAttribute('role', 'radio');
      b.setAttribute('aria-checked', 'false');
      b.setAttribute('aria-label', String(i));
      b.innerHTML = starSvg;

      b.onclick = () => setRating(i);
      b.onmouseenter = () => { state.hoverRating = i; paintStars(); };
      b.onmouseleave = () => { state.hoverRating = 0; paintStars(); };
      starsEl.appendChild(b);
    }

    renderChips();
    paintStars();
    updateReviewSections();
  }

  function paintStars() {
    const active = state.hoverRating || state.rating;
    const starsEl = document.getElementById('stars');
    if (!starsEl) return;

    [...starsEl.children].forEach((b, idx) => {
      const val = idx + 1;
      const on = val <= active;
      b.classList.toggle('on', on);
      b.setAttribute('aria-checked', state.rating === val ? 'true' : 'false');
    });

    const lbl = document.getElementById('ratingLabel');
    if (lbl) {
      lbl.textContent = active ? (t().ratings[active] || '') : '';
    }
  }

  function setRating(n) {
    state.rating = n;
    paintStars();
    updateReviewSections();

    const starsEl = document.getElementById('stars');
    if (starsEl && starsEl.children[n - 1]) {
      const btn = starsEl.children[n - 1];
      btn.classList.remove('pop');
      void btn.offsetWidth;
      btn.classList.add('pop');
    }

    setReviewLock();
  }

  function updateReviewSections() {
    const pos = document.getElementById('positive');
    const neg = document.getElementById('negative');
    const r = state.rating;

    if (pos) pos.classList.toggle('hidden', r < 4);
    if (neg) {
      neg.classList.toggle('hidden', !(r >= 1 && r <= 3));
      if (r >= 1 && r <= 3) {
        setTimeout(() => neg.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 100);
      }
    }
  }

  function renderChips() {
    const wrap = document.getElementById('chips');
    if (!wrap) return;
    wrap.innerHTML = '';
    const chipKeys = t().chips;

    Object.keys(chipKeys).forEach(key => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'chip rounded-full px-3 py-1.5 text-[11px] font-semibold';
      btn.textContent = chipKeys[key];
      const active = state.chips.has(key);
      btn.setAttribute('aria-pressed', active ? 'true' : 'false');
      btn.onclick = () => {
        if (state.chips.has(key)) state.chips.delete(key);
        else state.chips.add(key);
        btn.setAttribute('aria-pressed', state.chips.has(key) ? 'true' : 'false');
      };
      wrap.appendChild(btn);
    });
  }

  function buildWhatsAppUrl() {
    const L = t();
    const tableVal = state.table || 'N/A';
    const waiterVal = (document.getElementById('waiterName').value || '').trim() || (state.lang === 'ar' ? 'غير محدد' : 'Not specified');
    const commentVal = (document.getElementById('comment').value || '').trim() || (state.lang === 'ar' ? 'بدون ملاحظات' : 'None');
    const issues = [...state.chips].map(k => '• ' + (L.chips[k] || k)).join('\n') || (state.lang === 'ar' ? 'لا توجد ملاحظات محددة' : 'None specified');

    const lines = [
      state.lang === 'ar' ? '🚨 ملاحظة زبون جديدة (Ikatna):' : '🚨 New Customer Feedback (Ikatna):',
      ``,
      `🪑 ${state.lang === 'ar' ? 'الطاولة' : 'Table'}: #${tableVal}`,
      `👤 ${state.lang === 'ar' ? 'النادل' : 'Waiter'}: ${waiterVal}`,
      `⭐ ${state.lang === 'ar' ? 'التقييم' : 'Rating'}: ${state.rating}/5`,
      `⚠️ ${state.lang === 'ar' ? 'المشاكل المسجلة' : 'Issues'}:`,
      issues,
      `💬 ${state.lang === 'ar' ? 'التعليق' : 'Comment'}: ${commentVal}`
    ];

    return 'https://wa.me/' + CONFIG.whatsappNumber + '?text=' + encodeURIComponent(lines.join('\n'));
  }

  function escapeHtml(str) {
    return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('#langSwitch button').forEach(b => {
      b.onclick = () => applyLanguage(b.getAttribute('data-lang'));
    });

    const btnM = document.getElementById('tabBtnMenu');
    const btnR = document.getElementById('tabBtnReview');
    if (btnM) btnM.onclick = () => switchTab('menu');
    if (btnR) btnR.onclick = () => switchTab('review');

    const editBtn = document.getElementById('tableEditBtn');
    if (editBtn) {
      editBtn.onclick = () => {
        showTableForm();
        const inp = document.getElementById('tableInput');
        if (inp) inp.value = state.table;
      };
    }

    const okBtn = document.getElementById('tableOkBtn');
    const tInp = document.getElementById('tableInput');
    if (okBtn && tInp) {
      okBtn.onclick = () => setTable(tInp.value);
      tInp.onkeydown = (e) => { if (e.key === 'Enter') setTable(tInp.value); };
    }

    const qrBtn = document.getElementById('qrBtn');
    if (qrBtn) qrBtn.onclick = openQrModal;

    const cancelBtn = document.getElementById('cancelBtn');
    if (cancelBtn) {
      cancelBtn.onclick = () => {
        if (!state.cancelArmed) {
          state.cancelArmed = true;
          updateCancelButtonUI();
          setTimeout(() => {
            if (state.cancelArmed) {
              state.cancelArmed = false;
              updateCancelButtonUI();
            }
          }, 4000);
        } else {
          clearCart();
        }
      };
    }

    const qrClose = document.getElementById('qrClose');
    if (qrClose) qrClose.onclick = closeQrModal;

    const qrCancel = document.getElementById('qrCancel');
    if (qrCancel) qrCancel.onclick = clearCart;

    const qrModal = document.getElementById('qrModal');
    if (qrModal) {
      qrModal.onclick = (e) => {
        if (e.target === qrModal) closeQrModal();
      };
    }

    const mapsBtn = document.getElementById('mapsBtn');
    if (mapsBtn) mapsBtn.href = CONFIG.googleMapsReviewUrl;

    const publicLink = document.getElementById('publicLink');
    if (publicLink) publicLink.href = CONFIG.googleMapsReviewUrl;

    const waBtn = document.getElementById('waBtn');
    if (waBtn) {
      waBtn.onclick = () => {
        const url = buildWhatsAppUrl();
        window.open(url, '_blank', 'noopener');
        setReviewLock();
        updateReviewLockUI();
      };
    }

    window.__ikatna = {
      add: (id, delta) => modifyQty(id, delta)
    };

    initTable();
    applyLanguage('ar');
    initReview();
  });

})();
</script>
</body>
</html>
