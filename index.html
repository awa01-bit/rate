<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="noir">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0b0d" />
<title>Ikatna – Restaurant & Waiter Reviews</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Bitcount+Single:wght@100..900&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  const c = (v) => `rgb(var(--${v}) / <alpha-value>)`;
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ink:  { 950: c('ink-950'), 900: c('ink-900'), 800: c('ink-800'), 700: c('ink-700'), 600: c('ink-600') },
          gold: { 300: c('gold-300'), 400: c('gold-400'), 500: c('gold-500'), 600: c('gold-600') },
          fg: c('fg'),
          on: c('on')
        },
        fontFamily: {
          display: ['"Playfair Display"', 'Cairo', 'serif'],
          body: ['Inter', 'Cairo', 'system-ui', 'sans-serif']
        }
      }
    }
  };
</script>
<style>
  :root, [data-theme="noir"] {
    --ink-950: 11 11 13;   
    --ink-900: 18 18 22;   
    --ink-800: 26 26 32;   
    --ink-700: 37 37 45;   
    --ink-600: 52 52 62;   
    --gold-300: 241 217 138; 
    --gold-400: 230 195 92;
    --gold-500: 212 175 55;  
    --gold-600: 184 147 42;
    --shine: 241 217 138;    
    --fg: 255 255 255;       
    --on: 11 11 13;          
    --star-off: 90 90 102;
    --glow-a: .18; --glow-b: .08;
  }

  body {
    font-family: 'Inter', 'Cairo', system-ui, sans-serif;
    background:
      radial-gradient(60% 40% at 50% 0%, rgb(var(--gold-500) / var(--glow-a)), transparent 70%),
      radial-gradient(40% 30% at 100% 100%, rgb(var(--gold-500) / var(--glow-b)), transparent 70%),
      rgb(var(--ink-950));
    color: rgb(var(--fg));
  }
  html[lang="ar"] body { font-family: 'Cairo', 'Inter', system-ui, sans-serif; }
  .brand-font { font-family: 'Bitcount Single', 'Inter', monospace; font-weight: 600; letter-spacing: .12em; }

  .star { transition: transform .15s ease, filter .2s ease; -webkit-tap-highlight-color: transparent; }
  .star:active { transform: scale(.85); }
  .star svg { fill: transparent; stroke: rgb(var(--star-off)); transition: fill .2s, stroke .2s; }
  .star.on svg { fill: rgb(var(--gold-500)); stroke: rgb(var(--gold-500)); filter: drop-shadow(0 0 8px rgb(var(--gold-500) / .55)); }
  .pop { animation: pop .35s cubic-bezier(.2,1.4,.4,1); }
  @keyframes pop { from { transform: scale(.6); } to { transform: scale(1); } }
  .fade-up { animation: fadeUp .45s ease both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .chip { transition: all .15s ease; -webkit-tap-highlight-color: transparent; }
  .chip[aria-pressed="true"] { background: rgb(var(--gold-500) / .16); border-color: rgb(var(--gold-500)); color: rgb(var(--gold-300)); }
  .shimmer { background: linear-gradient(110deg, rgb(var(--gold-500)) 0%, rgb(var(--shine)) 45%, rgb(var(--gold-500)) 90%); }
  .glow-soft   { box-shadow: 0 0 40px rgb(var(--gold-500) / .15); }
  .glow-strong { box-shadow: 0 8px 30px rgb(var(--gold-500) / .35); }
  .card-shadow { box-shadow: 0 10px 30px rgb(0 0 0 / .12); }
  select:focus, textarea:focus, button:focus-visible { outline: 2px solid rgb(var(--gold-500)); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body class="min-h-screen antialiased">

<div class="relative z-10 mx-auto flex min-h-screen w-full max-w-md flex-col px-5 pb-6 pt-[max(1.25rem,env(safe-area-inset-top))]">

  <!-- Top bar: Live Date on the right, language switcher on the left -->
  <header class="flex items-center justify-between">
    <div class="inline-flex items-center gap-2 rounded-full border border-gold-500/30 bg-ink-900/70 px-3.5 py-1.5 text-xs font-semibold tracking-wide text-gold-300 backdrop-blur">
      <span class="h-1.5 w-1.5 rounded-full bg-gold-500 animate-pulse"></span>
      <span id="liveDate">--/--/----</span>
    </div>
    <div id="langSwitch" class="inline-flex rounded-full border border-ink-600 bg-ink-900/80 p-1 text-xs font-semibold" role="group" aria-label="Language">
      <button data-lang="ar" class="rounded-full px-3 py-1.5 transition">دارجة</button>
      <button data-lang="fr" class="rounded-full px-3 py-1.5 transition">FR</button>
      <button data-lang="en" class="rounded-full px-3 py-1.5 transition">EN</button>
    </div>
  </header>

  <!-- Branding -->
  <section class="mt-8 text-center fade-up">
    <div class="glow-soft mx-auto flex h-24 w-24 items-center justify-center rounded-2xl border border-gold-500/40 bg-gradient-to-br from-ink-800 to-ink-900">
      <svg viewBox="0 0 64 64" class="h-14 w-14" aria-hidden="true">
        <g transform="rotate(-28 32 32)" class="fill-gold-400">
          <ellipse cx="32" cy="14" rx="7.5" ry="10.5"/>
          <path d="M29.5 23C30.5 28 30.8 30 30.8 34V54a1.2 1.2 0 0 0 2.4 0V34C33.2 30 33.5 28 34.5 23Z"/>
        </g>
        <g transform="rotate(28 32 32)" class="fill-gold-300">
          <path d="M29 5C35.5 8 37 20 35.5 34H29Z"/>
          <rect x="29" y="35" width="6.5" height="21" rx="2.6"/>
        </g>
      </svg>
    </div>
    <p id="restName" class="mt-4 font-display text-lg text-gold-300">Restaurant Name</p>
    <h1 id="title" class="mt-2 text-2xl font-extrabold leading-snug sm:text-3xl"></h1>
    <p id="subtitle" class="mt-2 text-sm text-fg/60"></p>
  </section>

  <!-- Waiter Selection Module -->
  <section class="card-shadow mt-6 rounded-3xl border border-ink-700 bg-ink-900/80 p-4 backdrop-blur fade-up">
    <label for="waiterSelect" id="waiterLabel" class="block text-xs font-semibold uppercase tracking-wider text-gold-300 mb-2"></label>
    <select id="waiterSelect" class="w-full rounded-2xl border border-ink-600 bg-ink-800 p-3.5 text-sm text-fg focus:border-gold-500">
      <option value="" disabled selected id="waiterPlaceholder">اختر النادل...</option>
      <!-- Add your waiters here -->
      <option value="Youssef">يوسف (Youssef)</option>
      <option value="Mehdi">مهدي (Mehdi)</option>
      <option value="Amine">أمين (Amine)</option>
    </select>
  </section>

  <!-- Rating card -->
  <section class="card-shadow mt-5 rounded-3xl border border-ink-700 bg-ink-900/80 p-5 backdrop-blur fade-up">
    <div id="stars" class="flex justify-center gap-1.5" dir="ltr" role="radiogroup" aria-label="Rating"></div>
    <p id="ratingLabel" class="mt-3 h-6 text-center text-sm font-semibold text-gold-300"></p>
  </section>

  <!-- Positive: Google Maps -->
  <section id="positive" class="mt-5 hidden rounded-3xl border border-gold-500/30 bg-gradient-to-b from-gold-500/10 to-ink-900/80 p-6 text-center">
    <div class="pop mx-auto mb-3 flex h-14 w-14 items-center justify-center rounded-full bg-gold-500/15 text-3xl">🎉</div>
    <h2 id="posTitle" class="text-xl font-bold"></h2>
    <p id="posText" class="mt-2 text-sm leading-relaxed text-fg/75"></p>
    <a id="mapsBtn" href="#" target="_blank" rel="noopener noreferrer"
       class="shimmer glow-strong mt-5 flex w-full items-center justify-center gap-2 rounded-2xl px-5 py-4 text-base font-extrabold text-on transition active:scale-[.98]">
      <svg viewBox="0 0 24 24" class="h-5 w-5" fill="currentColor" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
      <span id="mapsLabel"></span>
    </a>
  </section>

  <!-- Negative: private feedback -->
  <section id="negative" class="mt-5 hidden rounded-3xl border border-ink-700 bg-ink-900/80 p-5">
    <h2 id="negTitle" class="text-lg font-bold"></h2>
    <p id="negText" class="mt-1 text-sm leading-relaxed text-fg/60"></p>

    <p id="chipsLabel" class="mt-5 text-xs font-semibold uppercase tracking-wider text-gold-300"></p>
    <div id="chips" class="mt-2 flex flex-wrap gap-2"></div>

    <label id="commentLabel" for="comment" class="mt-5 block text-xs font-semibold uppercase tracking-wider text-gold-300"></label>
    <textarea id="comment" rows="4" maxlength="600"
      class="mt-2 w-full resize-none rounded-2xl border border-ink-600 bg-ink-800 p-3.5 text-sm text-fg placeholder:text-fg/40 focus:border-gold-500"></textarea>

    <button id="waBtn" type="button"
      class="mt-5 flex w-full items-center justify-center gap-2 rounded-2xl bg-[#25D366] px-5 py-4 text-base font-extrabold text-[#0b0b0d] shadow-[0_8px_30px_rgba(37,211,102,.25)] transition active:scale-[.98]">
      <svg viewBox="0 0 24 24" class="h-5 w-5" fill="currentColor" aria-hidden="true"><path d="M12.04 2a9.9 9.9 0 0 0-8.47 15l-1.5 5.5 5.64-1.48A9.9 9.9 0 1 0 12.04 2zm5.8 14.1c-.25.7-1.45 1.34-2 1.4-.5.06-1.13.09-1.82-.12-.42-.13-.96-.31-1.65-.6-2.9-1.25-4.8-4.17-4.94-4.37-.14-.19-1.18-1.57-1.18-3s.75-2.13 1.02-2.42c.27-.29.58-.36.78-.36h.56c.18 0 .42-.07.65.5.25.58.84 2.02.91 2.17.07.14.12.31.02.5-.1.2-.15.31-.3.48-.14.17-.3.38-.43.51-.14.14-.29.3-.12.58.17.29.75 1.24 1.62 2.01 1.1.98 2.03 1.29 2.32 1.43.29.14.46.12.63-.07.17-.2.72-.84.91-1.13.2-.29.38-.24.65-.14.27.1 1.7.8 2 .95.29.14.48.22.55.34.07.12.07.7-.18 1.4z"/></svg>
      <span id="waLabel"></span>
    </button>
    <p id="waHint" class="mt-3 text-center text-xs text-fg/45"></p>
  </section>

  <div class="flex-1"></div>

  <!-- Footer -->
  <footer class="mt-10 text-center">
    <div class="mx-auto mb-3 h-px w-16 bg-gradient-to-r from-transparent via-gold-500/50 to-transparent"></div>
    <p class="text-xs text-fg/45">
      <span id="poweredBy"></span>
      <span class="brand-font text-[12px] text-gold-300" dir="ltr"><span class="text-fg">I</span>k<span class="text-fg">at</span>na</span>
    </p>
  </footer>
</div>
