<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0b0d" />
<title>Ikatna – Menu & Reviews</title>

<!-- Fonts: Playfair Display (headings), Inter (Latin text), Cairo (Arabic), Bitcount Single (Ikatna wordmark) -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bitcount+Single:wght@100..900&family=Cairo:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet" />

<!-- Tailwind CSS (CDN) and qrcode.js (CDN) – no build step, works on GitHub Pages -->
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ink:  { 950: '#0b0b0d', 900: '#121216', 800: '#1a1a20', 700: '#25252d', 600: '#34343e' },
          gold: { 300: '#f1d98a', 400: '#e6c35c', 500: '#d4af37', 600: '#b8932a' }
        },
        fontFamily: {
          display: ['"Playfair Display"', 'Cairo', 'serif'],
          body: ['Inter', 'Cairo', 'system-ui', 'sans-serif']
        }
      }
    }
  };
</script>

<style>
  /* ---------- Base ---------- */
  html { scroll-behavior: smooth; }
  body { font-family: 'Inter', 'Cairo', system-ui, sans-serif; background: #0b0b0d; }
  html[lang="ar"] body { font-family: 'Cairo', 'Inter', system-ui, sans-serif; }
  .no-scrollbar { scrollbar-width: none; }
  .no-scrollbar::-webkit-scrollbar { display: none; }

  /* Soft golden aurora behind everything */
  .aurora {
    background:
      radial-gradient(60% 38% at 50% -5%, rgba(212,175,55,.20), transparent 70%),
      radial-gradient(45% 30% at 100% 60%, rgba(212,175,55,.07), transparent 70%),
      radial-gradient(45% 30% at 0% 90%, rgba(212,175,55,.06), transparent 70%),
      #0b0b0d;
  }

  /* ---------- Frosted glass ---------- */
  .glass {
    background: rgba(255,255,255,.045);
    border: 1px solid rgba(255,255,255,.09);
    -webkit-backdrop-filter: blur(16px);
            backdrop-filter: blur(16px);
  }
  .glass-strong {
    background: rgba(18,18,22,.82);
    border: 1px solid rgba(212,175,55,.28);
    -webkit-backdrop-filter: blur(22px);
            backdrop-filter: blur(22px);
  }
  .nav-glass {
    background: rgba(11,11,13,.78);
    border-bottom: 1px solid rgba(255,255,255,.07);
    -webkit-backdrop-filter: blur(18px);
            backdrop-filter: blur(18px);
  }

  /* ---------- Gold ---------- */
  .gold-text {
    background: linear-gradient(110deg, #b8932a 0%, #f1d98a 40%, #d4af37 60%, #f1d98a 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .btn-gold {
    background: linear-gradient(110deg, #d4af37 0%, #f1d98a 45%, #d4af37 90%);
    color: #0b0b0d; font-weight: 800;
    box-shadow: 0 8px 26px rgba(212,175,55,.28);
    transition: transform .15s ease, box-shadow .2s ease, opacity .2s;
  }
  .btn-gold:active { transform: scale(.97); }
  .btn-gold:hover  { box-shadow: 0 10px 32px rgba(212,175,55,.42); }

  /* ---------- Wordmark ---------- */
  .brand-font { font-family: 'Bitcount Single', 'Inter', monospace; font-weight: 600; letter-spacing: .12em; }

  /* ---------- Focus ---------- */
  button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible {
    outline: 2px solid #d4af37; outline-offset: 2px;
  }

  /* ---------- Language switch / tabs / pills ---------- */
  .lang-on { background: #d4af37; color: #0b0b0d; }
  .tab-on  { background: linear-gradient(110deg,#d4af37,#f1d98a); color: #0b0b0d; box-shadow: 0 6px 20px rgba(212,175,55,.25); }
  .pill { border: 1px solid rgba(255,255,255,.12); color: rgba(255,255,255,.72); background: rgba(255,255,255,.04); transition: all .18s ease; }
  .pill[aria-pressed="true"] { background: rgba(212,175,55,.16); border-color: #d4af37; color: #f1d98a; }

  /* ---------- Dish cards ---------- */
  .dish { transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease; }
  .dish:hover { transform: translateY(-3px); border-color: rgba(212,175,55,.35); box-shadow: 0 18px 40px rgba(0,0,0,.45); }
  .badge { display: inline-flex; align-items: center; gap: .3rem; border-radius: 9999px; padding: .2rem .6rem; font-size: .72rem; font-weight: 600;
           border: 1px solid rgba(255,255,255,.12); color: rgba(255,255,255,.8); background: rgba(255,255,255,.05); white-space: nowrap; }
  .badge-ok    { border-color: rgba(52,211,153,.45);  color: #6ee7b7; background: rgba(52,211,153,.10); }
  .badge-heart { border-color: rgba(251,113,133,.45); color: #fda4af; background: rgba(251,113,133,.10); }
  details > summary { list-style: none; cursor: pointer; }
  details > summary::-webkit-details-marker { display: none; }
  details[open] .chev { transform: rotate(180deg); }
  .chev { transition: transform .2s ease; }

  /* ---------- Stars ---------- */
  .star { transition: transform .15s ease; -webkit-tap-highlight-color: transparent; }
  .star:active { transform: scale(.85); }
  .star svg { fill: transparent; stroke: #5a5a66; transition: fill .2s, stroke .2s; }
  .star.on svg { fill: #d4af37; stroke: #d4af37; filter: drop-shadow(0 0 8px rgba(212,175,55,.55)); }

  /* ---------- Chips ---------- */
  .chip { border: 1px solid #34343e; background: #1a1a20; color: rgba(255,255,255,.8); transition: all .15s ease; -webkit-tap-highlight-color: transparent; }
  .chip[aria-pressed="true"] { background: rgba(212,175,55,.16); border-color: #d4af37; color: #f1d98a; }

  /* ---------- Animations ---------- */
  .pop { animation: pop .35s cubic-bezier(.2,1.4,.4,1); }
  @keyframes pop { from { transform: scale(.6); } to { transform: scale(1); } }
  .fade-up { animation: fadeUp .45s ease both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  /* QR output */
  #qrBox img, #qrBox canvas { max-width: 100%; height: auto; margin: 0 auto; }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>

<body class="min-h-screen bg-ink-950 text-white antialiased">
<div class="aurora fixed inset-0 -z-10" aria-hidden="true"></div>

<!-- ======================================================= HEADER -->
<header class="mx-auto flex max-w-6xl items-center justify-between px-5 pb-1 pt-[max(1rem,env(safe-area-inset-top))]">
  <!-- Ikatna wordmark: I, A, T in white, rest in gold -->
  <span class="brand-font text-[12px] text-gold-400" dir="ltr" aria-label="Ikatna"><span class="text-white">I</span>k<span class="text-white">at</span>na</span>

  <div id="langSwitch" class="inline-flex rounded-full border border-white/10 bg-white/5 p-1 text-xs font-semibold" role="group" aria-label="Language">
    <button data-lang="ar" class="rounded-full px-3 py-1.5 transition">عربي</button>
    <button data-lang="fr" class="rounded-full px-3 py-1.5 transition">FR</button>
    <button data-lang="en" class="rounded-full px-3 py-1.5 transition">EN</button>
  </div>
</header>

<!-- ======================================================= HERO -->
<section class="mx-auto max-w-6xl px-5 pb-5 pt-5 text-center fade-up">
  <p data-i18n="welcome" class="text-xs font-semibold uppercase tracking-[.3em] text-gold-300/80"></p>
  <h1 id="restName" class="gold-text mt-2 font-display text-4xl font-extrabold leading-tight sm:text-5xl"></h1>
  <p data-i18n="tagline" class="mx-auto mt-2 max-w-md text-sm text-white/60"></p>

  <!-- Table number (read from ?table=, validated, written with textContent only) -->
  <div class="glass mt-5 inline-flex items-center gap-3 rounded-full px-5 py-2.5">
    <span class="flex h-8 w-8 items-center justify-center rounded-full bg-gold-500/15 text-gold-400">
      <svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10h18M5 10v10M19 10v10M2 6h20"/></svg>
    </span>
    <span data-i18n="table" class="text-xs font-semibold uppercase tracking-widest text-white/60"></span>
    <span id="tableNum" class="font-display text-2xl font-bold text-gold-300" dir="ltr">—</span>
  </div>
  <p id="tableWarn" class="mx-auto mt-3 hidden max-w-sm text-xs text-amber-300/90"></p>
</section>

<!-- ======================================================= STICKY NAV: tabs + category pills -->
<div class="nav-glass sticky top-0 z-30">
  <div class="mx-auto max-w-6xl px-5 pb-2 pt-2.5">
    <div class="glass grid grid-cols-2 gap-1 rounded-full p-1" role="tablist">
      <button id="tabBtnMenu"   role="tab" aria-selected="true"  aria-controls="panelMenu"   class="rounded-full px-4 py-2.5 text-sm font-bold transition" data-i18n="tabMenu"></button>
      <button id="tabBtnReview" role="tab" aria-selected="false" aria-controls="panelReview" class="rounded-full px-4 py-2.5 text-sm font-bold transition" data-i18n="tabReview"></button>
    </div>
    <div id="pills" class="no-scrollbar -mx-5 mt-2.5 flex gap-2 overflow-x-auto px-5 pb-1" role="group"></div>
  </div>
</div>

<!-- ======================================================= MENU TAB -->
<main id="panelMenu" role="tabpanel" class="mx-auto max-w-6xl px-5 pb-36 pt-6">
  <div id="menuRoot"></div>
  <p data-i18n="nutriNote" class="mx-auto mt-10 max-w-lg text-center text-xs leading-relaxed text-white/40"></p>
</main>

<!-- ======================================================= REVIEW TAB -->
<main id="panelReview" role="tabpanel" class="mx-auto hidden max-w-xl px-5 pb-16 pt-6">

  <!-- Shown after a review was sent from this device for this table -->
  <div id="reviewLocked" class="glass hidden rounded-3xl p-7 text-center">
    <div class="pop mx-auto mb-3 flex h-14 w-14 items-center justify-center rounded-full bg-gold-500/15 text-3xl">🙏</div>
    <h2 data-i18n="lockedTitle" class="text-xl font-bold"></h2>
    <p data-i18n="lockedText" class="mt-2 text-sm leading-relaxed text-white/65"></p>
  </div>

  <div id="reviewFlow">
    <div class="glass rounded-3xl p-5">
      <h2 data-i18n="reviewTitle" class="text-center font-display text-2xl font-bold"></h2>
      <p data-i18n="reviewSub" class="mt-1 text-center text-sm text-white/60"></p>

      <label for="waiterName" data-i18n="waiterLabel" class="mt-5 block text-xs font-semibold uppercase tracking-wider text-gold-300"></label>
      <input id="waiterName" type="text" maxlength="40" autocomplete="off"
             class="mt-2 w-full rounded-2xl border border-ink-600 bg-ink-800 p-3.5 text-sm text-white placeholder:text-white/35 focus:border-gold-500" />

      <div id="stars" class="mt-6 flex justify-center gap-1.5" dir="ltr" role="radiogroup" aria-label="Rating"></div>
      <p id="ratingLabel" class="mt-3 h-6 text-center text-sm font-semibold text-gold-300"></p>
    </div>

    <!-- 4–5 stars → Google Maps -->
    <section id="positive" class="mt-5 hidden rounded-3xl border border-gold-500/30 bg-gradient-to-b from-gold-500/10 to-transparent p-6 text-center">
      <div class="pop mx-auto mb-3 flex h-14 w-14 items-center justify-center rounded-full bg-gold-500/15 text-3xl">🎉</div>
      <h2 data-i18n="posTitle" class="text-xl font-bold"></h2>
      <p data-i18n="posText" class="mt-2 text-sm leading-relaxed text-white/70"></p>
      <a id="mapsBtn" href="#" target="_blank" rel="noopener noreferrer"
         class="btn-gold mt-5 flex w-full items-center justify-center gap-2 rounded-2xl px-5 py-4 text-base">
        <svg viewBox="0 0 24 24" class="h-5 w-5" fill="currentColor" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
        <span data-i18n="mapsBtn"></span>
      </a>
    </section>

    <!-- 1–3 stars → private feedback to the manager -->
    <section id="negative" class="glass mt-5 hidden rounded-3xl p-5">
      <h2 data-i18n="negTitle" class="text-lg font-bold"></h2>
      <p data-i18n="negText" class="mt-1 text-sm leading-relaxed text-white/60"></p>

      <p data-i18n="chipsLabel" class="mt-5 text-xs font-semibold uppercase tracking-wider text-gold-300"></p>
      <div id="chips" class="mt-2 flex flex-wrap gap-2"></div>

      <label for="comment" data-i18n="commentLabel" class="mt-5 block text-xs font-semibold uppercase tracking-wider text-gold-300"></label>
      <textarea id="comment" rows="4" maxlength="600"
        class="mt-2 w-full resize-none rounded-2xl border border-ink-600 bg-ink-800 p-3.5 text-sm text-white placeholder:text-white/35 focus:border-gold-500"></textarea>

      <button id="waBtn" type="button"
        class="mt-5 flex w-full items-center justify-center gap-2 rounded-2xl bg-[#25D366] px-5 py-4 text-base font-extrabold text-[#0b0b0d] shadow-[0_8px_30px_rgba(37,211,102,.25)] transition active:scale-[.98]">
        <svg viewBox="0 0 24 24" class="h-5 w-5" fill="currentColor" aria-hidden="true"><path d="M12.04 2a9.9 9.9 0 0 0-8.47 15l-1.5 5.5 5.64-1.48A9.9 9.9 0 1 0 12.04 2zm5.8 14.1c-.25.7-1.45 1.34-2 1.4-.5.06-1.13.09-1.82-.12-.42-.13-.96-.31-1.65-.6-2.9-1.25-4.8-4.17-4.94-4.37-.14-.19-1.18-1.57-1.18-3s.75-2.13 1.02-2.42c.27-.29.58-.36.78-.36h.56c.18 0 .42-.07.65.5.25.58.84 2.02.91 2.17.07.14.12.31.02.5-.1.2-.15.31-.3.48-.14.17-.3.38-.43.51-.14.14-.29.3-.12.58.17.29.75 1.24 1.62 2.01 1.1.98 2.03 1.29 2.32 1.43.29.14.46.12.63-.07.17-.2.72-.84.91-1.13.2-.29.38-.24.65-.14.27.1 1.7.8 2 .95.29.14.48.22.55.34.07.12.07.7-.18 1.4z"/></svg>
        <span data-i18n="waBtn"></span>
      </button>
      <p data-i18n="waHint" class="mt-3 text-center text-xs text-white/40"></p>

      <!-- Always let the customer post publicly too (keeps the flow fair and within Google's review rules) -->
      <a id="publicLink" href="#" target="_blank" rel="noopener noreferrer"
         data-i18n="publicLink" class="mt-4 block text-center text-xs text-white/50 underline underline-offset-4 hover:text-gold-300"></a>
    </section>
  </div>
</main>

<!-- ======================================================= FOOTER -->
<footer class="mx-auto max-w-6xl px-5 pb-32 pt-4 text-center">
  <div class="mx-auto mb-3 h-px w-16 bg-gradient-to-r from-transparent via-gold-500/50 to-transparent"></div>
  <p class="text-xs text-white/40">
    <span data-i18n="poweredBy"></span>
    <span class="brand-font text-[12px] text-gold-400" dir="ltr"><span class="text-white">I</span>k<span class="text-white">at</span>na</span>
  </p>
</footer>

<!-- ======================================================= STICKY CART BAR -->
<div id="cartBar" class="pointer-events-none fixed inset-x-0 bottom-0 z-40 translate-y-full px-3 pb-[max(.75rem,env(safe-area-inset-bottom))] transition-transform duration-300" aria-hidden="true">
  <div class="glass-strong mx-auto flex max-w-xl items-center justify-between gap-3 rounded-2xl p-3 shadow-[0_-10px_40px_rgba(0,0,0,.5)]">
    <div class="min-w-0 ps-2">
      <p id="cartCount" class="text-xs font-semibold uppercase tracking-wider text-white/60"></p>
      <p id="cartTotal" class="font-display text-xl font-bold text-gold-300"></p>
    </div>
    <button id="qrBtn" type="button" class="btn-gold flex shrink-0 items-center gap-2 rounded-xl px-4 py-3 text-sm">
      <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h3M20 17v4"/></svg>
      <span data-i18n="showQr"></span>
    </button>
  </div>
</div>

<!-- ======================================================= QR MODAL -->
<div id="qrModal" class="fixed inset-0 z-50 hidden items-end justify-center bg-black/75 backdrop-blur-sm sm:items-center" role="dialog" aria-modal="true" aria-labelledby="qrTitle">
  <div class="glass-strong fade-up max-h-[92vh] w-full max-w-md overflow-y-auto rounded-t-3xl p-6 sm:rounded-3xl">
    <div class="text-center">
      <h2 id="qrTitle" data-i18n="qrTitle" class="font-display text-2xl font-bold"></h2>
      <p class="mt-1 text-sm text-white/60">
        <span data-i18n="table"></span>
        <span id="qrTable" class="font-bold text-gold-300" dir="ltr"></span>
        <span class="mx-1 text-white/30">·</span>
        <span id="qrRef" class="font-mono text-xs tracking-widest text-white/50" dir="ltr"></span>
      </p>
    </div>

    <div class="mx-auto mt-5 w-fit rounded-2xl bg-white p-4 shadow-[0_0_40px_rgba(212,175,55,.25)]">
      <div id="qrBox" class="flex h-[224px] w-[224px] items-center justify-center" dir="ltr"></div>
    </div>
    <p id="qrError" class="mt-3 hidden text-center text-xs text-amber-300"></p>
    <p data-i18n="qrHint" class="mt-3 text-center text-xs text-white/55"></p>

    <ul id="qrList" class="mt-5 space-y-2 border-t border-white/10 pt-4 text-sm"></ul>
    <div class="mt-3 flex items-center justify-between border-t border-white/10 pt-3">
      <span data-i18n="total" class="text-sm font-semibold text-white/70"></span>
      <span id="qrTotal" class="font-display text-xl font-bold text-gold-300"></span>
    </div>

    <button id="qrClose" type="button" data-i18n="close"
      class="mt-5 w-full rounded-2xl border border-white/15 bg-white/5 px-5 py-3.5 text-sm font-bold transition hover:bg-white/10"></button>
  </div>
</div>

<script>

     CONFIG – edit these values for each restaurant

  /* ---------- Table number: read from ?table=, validated, never injected as HTML ---------- */
  function readTable() {
    try {
      const raw = new URLSearchParams(location.search).get('table');
      if (!raw) return null;
      const v = raw.trim();
      return /^[A-Za-z0-9-]{1,6}$/.test(v) ? v.toUpperCase() : null;   // 1–6 letters/digits/dashes only
    } catch (e) { return null; }
  }
  const TABLE = readTable();

  /* =========================================================
     STATE
     ========================================================= */
  const state = { lang: 'ar', tab: 'menu', cat: 'all', rating: 0, hover: 0, tags: new Set() };
  const cart = new Map();                           // dish id -> quantity
  let lastFocus = null;
  let qrRef = '';

  /* ---------- Cart persistence (per table, this tab only) ---------- */
  const CART_KEY = 'ikatna_cart_' + (TABLE || 'x');
  function saveCart() { try { sessionStorage.setItem(CART_KEY, JSON.stringify([...cart])); } catch (e) {} }
  function loadCart() {
    try {
      const data = JSON.parse(sessionStorage.getItem(CART_KEY) || '[]');
      data.forEach(([id, q]) => { if (byId[id] && Number.isInteger(q) && q > 0 && q < 100) cart.set(id, q); });
    } catch (e) {}
  }
  const cartCount = () => [...cart.values()].reduce((a, b) => a + b, 0);
  const cartTotal = () => [...cart].reduce((sum, [id, q]) => sum + byId[id].price * q, 0);

  /* =========================================================
     STATIC TEXT / LANGUAGE
     ========================================================= */
  function applyStaticText() {
    const L = t();
    document.querySelectorAll('[data-i18n]').forEach((el) => { const v = L[el.dataset.i18n]; if (typeof v === 'string') el.textContent = v; });
    $('restName').textContent = CONFIG.restaurantName[state.lang];
    $('waiterName').placeholder = L.waiterPh;
    $('comment').placeholder = L.commentPh;
    $('mapsBtn').href = CONFIG.googleMapsReviewUrl;
    $('publicLink').href = CONFIG.googleMapsReviewUrl;
    $('tableNum').textContent = TABLE || '—';        // textContent only: safe even with hostile URLs
    const warn = $('tableWarn');
    warn.textContent = TABLE ? '' : L.noTable;
    warn.classList.toggle('hidden', !!TABLE);
  }

  function applyLang(lang) {
    state.lang = lang;
    const L = t();
    document.documentElement.lang = L.lang;
    document.documentElement.dir = L.dir;
    document.querySelectorAll('#langSwitch button').forEach((b) => {
      const on = b.dataset.lang === lang;
      b.classList.toggle('lang-on', on);
      b.classList.toggle('text-white/60', !on);
      b.setAttribute('aria-pressed', String(on));
    });
    applyStaticText();
    renderPills();
    renderMenu();
    renderCartBar();
    renderChips();
    paintStars();
    if (!$('qrModal').classList.contains('hidden')) fillQrModal(false);
    try { localStorage.setItem('ikatna_lang', lang); } catch (e) {}
  }

  /* =========================================================

     ========================================================= */
  function setTab(tab) {
    state.tab = tab;
    const isMenu = tab === 'menu';
    $('panelMenu').classList.toggle('hidden', !isMenu);
    $('panelReview').classList.toggle('hidden', isMenu);
    $('pills').classList.toggle('hidden', !isMenu);
    $('tabBtnMenu').setAttribute('aria-selected', String(isMenu));
    $('tabBtnReview').setAttribute('aria-selected', String(!isMenu));
    $('tabBtnMenu').classList.toggle('tab-on', isMenu);
    $('tabBtnReview').classList.toggle('tab-on', !isMenu);
    $('tabBtnMenu').classList.toggle('text-white/70', !isMenu);
    $('tabBtnReview').classList.toggle('text-white/70', isMenu);
    renderCartBar();
    if (!isMenu) renderReviewState();
  }

  /* =========================================================
     MENU – category pills + dish cards
     ========================================================= */
  function renderPills() {
    const wrap = $('pills');
    wrap.innerHTML = '';
    ['all', ...CATS].forEach((c) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'pill shrink-0 rounded-full px-4 py-2 text-sm font-semibold';
      b.textContent = t().cats[c];
      b.setAttribute('aria-pressed', String(state.cat === c));
      b.addEventListener('click', () => { state.cat = c; renderPills(); renderMenu(); });
      wrap.appendChild(b);
    });
  }

  function controlsHtml(id) {
    const u = t();
    const q = cart.get(id) || 0;
    if (!q) {
      return '<button type="button" data-act="add" data-id="' + id + '" class="btn-gold rounded-full px-5 py-2 text-sm">+ ' + esc(u.add) + '</button>';
    }
    return '<div class="inline-flex items-center gap-1 rounded-full border border-gold-500/40 bg-gold-500/10 p-1">' +
      '<button type="button" data-act="dec" data-id="' + id + '" aria-label="' + esc(u.remove) + '" class="flex h-8 w-8 items-center justify-center rounded-full bg-white/10 text-lg font-bold transition hover:bg-white/20">−</button>' +
      '<span class="min-w-[2rem] text-center text-base font-bold text-gold-300" aria-live="polite">' + fmt(q) + '</span>' +
      '<button type="button" data-act="inc" data-id="' + id + '" aria-label="' + esc(u.increase) + '" class="btn-gold flex h-8 w-8 items-center justify-center rounded-full text-lg">+</button>' +
      '</div>';
  }

  function cardHtml(d) {
    const L = d[state.lang], u = t();
    const badges =
      '<span class="badge">🔥 ' + fmt(d.kcal) + ' ' + esc(u.kcal) + '</span>' +
      '<span class="badge">💪 ' + fmt(d.protein) + ' ' + esc(u.g) + ' ' + esc(u.protein) + '</span>' +
      (d.diabetic ? '<span class="badge badge-ok">✓ ' + esc(u.diabetic) + '</span>' : '') +
      (d.lowChol ? '<span class="badge badge-heart">♥ ' + esc(u.lowChol) + '</span>' : '');
    return '' +
    '<article class="dish glass group flex flex-col overflow-hidden rounded-3xl" data-card="' + d.id + '">' +
      '<div class="relative aspect-[4/3] overflow-hidden bg-gradient-to-br from-ink-800 to-ink-900">' +
        '<div class="absolute inset-0 flex items-center justify-center text-gold-500/30">' + ICON_FORK + '</div>' +
        '<img src="' + esc(IMG(d.img)) + '" alt="' + esc(L.name) + '" loading="lazy" decoding="async" referrerpolicy="no-referrer" ' +
          'class="absolute inset-0 h-full w-full object-cover transition duration-700 group-hover:scale-105" onerror="this.remove()" />' +
        '<div class="absolute inset-x-0 bottom-0 h-1/2 bg-gradient-to-t from-black/70 to-transparent"></div>' +
        '<span class="glass absolute end-3 top-3 rounded-full px-3 py-1 text-sm font-bold text-gold-300">' + esc(money(d.price)) + '</span>' +
      '</div>' +
      '<div class="flex flex-1 flex-col p-4">' +
        '<h3 class="font-display text-xl font-bold leading-snug">' + esc(L.name) + '</h3>' +
        '<p class="mt-1 text-sm leading-relaxed text-white/65">' + esc(L.desc) + '</p>' +
        '<div class="mt-3 flex flex-wrap gap-1.5">' + badges + '</div>' +
        '<details class="mt-3">' +
          '<summary class="flex items-center justify-between rounded-xl bg-white/5 px-3 py-2 text-xs font-semibold uppercase tracking-wider text-gold-300">' +
            '<span>' + esc(u.ingredients) + '</span>' +
            '<svg class="chev h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>' +
          '</summary>' +
          '<p class="px-1 pt-2 text-xs leading-relaxed text-white/60">' + L.ing.map(esc).join(' · ') + '</p>' +
        '</details>' +
        '<div class="mt-auto flex justify-end pt-4" data-controls="' + d.id + '">' + controlsHtml(d.id) + '</div>' +
      '</div>' +
    '</article>';
  }

  function renderMenu() {
    const cats = state.cat === 'all' ? CATS : [state.cat];
    $('menuRoot').innerHTML = cats.map((c) => {
      const dishes = MENU.filter((d) => d.cat === c);
      return '<section class="mb-10"><h2 class="mb-4 flex items-center gap-3 font-display text-2xl font-bold">' +
        '<span class="gold-text">' + esc(t().cats[c]) + '</span><span class="h-px flex-1 bg-gradient-to-r from-gold-500/40 to-transparent"></span></h2>' +
        '<div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">' + dishes.map(cardHtml).join('') + '</div></section>';
    }).join('');
  }

  /* One delegated listener for all + / − / Add buttons */
  $('menuRoot').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-act]');
    if (!btn) return;
    const id = btn.dataset.id;
    if (!byId[id]) return;
    const q = cart.get(id) || 0;
    const next = btn.dataset.act === 'dec' ? q - 1 : q + 1;
    if (next <= 0) cart.delete(id); else cart.set(id, Math.min(next, 20));
    saveCart();
    updateCardControls(id);
    renderCartBar();
  });

  function updateCardControls(id) {
    const box = document.querySelector('[data-controls="' + id + '"]');
    if (box) box.innerHTML = controlsHtml(id);
  }

  /* =========================================================
     CART BAR
     ========================================================= */
  function renderCartBar() {
    const n = cartCount();
    const show = n > 0 && state.tab === 'menu';
    const bar = $('cartBar');
    bar.classList.toggle('translate-y-full', !show);
    bar.classList.toggle('pointer-events-none', !show);
    bar.setAttribute('aria-hidden', String(!show));
    $('cartCount').textContent = t().items(n);
    $('cartTotal').textContent = money(cartTotal());
  }

  /* =========================================================
     QR MODAL – scannable order summary for the waiter
     ========================================================= */
  function newRef() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let r = '';
    const rnd = (window.crypto && crypto.getRandomValues) ? crypto.getRandomValues(new Uint8Array(4)) : [1, 2, 3, 4].map(() => Math.floor(Math.random() * 256));
    for (let i = 0; i < 4; i++) r += chars[rnd[i] % chars.length];
    return r;
  }

  /* Clean, ASCII-only text so any QR scanner reads it correctly, regardless of the customer's language */
  function buildOrderText() {
    const now = new Date();
    const hh = String(now.getHours()).padStart(2, '0'), mm = String(now.getMinutes()).padStart(2, '0');
    const lines = ['IKATNA ORDER', 'TABLE: ' + (TABLE || 'UNKNOWN'), 'REF: ' + qrRef + ' ' + hh + ':' + mm, '------'];
    cart.forEach((q, id) => lines.push(q + 'x ' + byId[id].qrName));
    lines.push('------', 'ITEMS: ' + cartCount(), 'TOTAL: ' + cartTotal() + ' ' + CONFIG.currencyCode);
    return lines.join('\n');
  }

  function fillQrModal(regenerate) {
    const u = t();
    $('qrTable').textContent = TABLE || '—';
    $('qrRef').textContent = '#' + qrRef;
    $('qrList').innerHTML = [...cart].map(([id, q]) =>
      '<li class="flex items-start justify-between gap-3"><span class="text-white/85">' + fmt(q) + '× ' + esc(byId[id][state.lang].name) +
      '</span><span class="shrink-0 text-white/60">' + esc(money(byId[id].price * q)) + '</span></li>').join('');
    $('qrTotal').textContent = money(cartTotal());
    if (!regenerate) return;

    const box = $('qrBox'), err = $('qrError');
    box.innerHTML = '';
    err.classList.add('hidden');
    const text = buildOrderText();
    try {
      if (typeof QRCode === 'undefined') throw new Error('qrcode.js not loaded');
      new QRCode(box, {
        text: text, width: 224, height: 224,
        colorDark: '#0b0b0d', colorLight: '#ffffff',
        correctLevel: text.length > 900 ? QRCode.CorrectLevel.L : QRCode.CorrectLevel.M
      });
    } catch (e) {
      err.textContent = u.qrFail;
      err.classList.remove('hidden');
    }
  }

  function openQr() {
    if (!cartCount()) return;
    lastFocus = document.activeElement;
    qrRef = newRef();
    const m = $('qrModal');
    m.classList.remove('hidden');
    m.classList.add('flex');
    document.body.style.overflow = 'hidden';
    fillQrModal(true);
    $('qrClose').focus();
  }

  function closeQr() {
    const m = $('qrModal');
    m.classList.add('hidden');
    m.classList.remove('flex');
    document.body.style.overflow = '';
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }

  $('qrBtn').addEventListener('click', openQr);
  $('qrClose').addEventListener('click', closeQr);
  $('qrModal').addEventListener('click', (e) => { if (e.target === $('qrModal')) closeQr(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('qrModal').classList.contains('hidden')) closeQr(); });

  /* =========================================================
     REVIEW – stars, Google Maps / private feedback
     ========================================================= */
  const starsEl = $('stars');
  const starSvg = '<svg viewBox="0 0 24 24" class="h-11 w-11 sm:h-12 sm:w-12" stroke-width="1.6" stroke-linejoin="round"><path d="M12 2.5l2.9 6.1 6.6.9-4.8 4.6 1.2 6.6L12 17.5l-5.9 3.2 1.2-6.6L2.5 9.5l6.6-.9L12 2.5z"/></svg>';
  for (let i = 1; i <= 5; i++) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'star p-1';
    b.setAttribute('role', 'radio');
    b.setAttribute('aria-checked', 'false');
    b.innerHTML = starSvg;
    b.addEventListener('click', () => setRating(i));
    b.addEventListener('mouseenter', () => { state.hover = i; paintStars(); });
    b.addEventListener('mouseleave', () => { state.hover = 0; paintStars(); });
    starsEl.appendChild(b);
  }

  function paintStars() {
    const active = state.hover || state.rating;
    [...starsEl.children].forEach((b, idx) => {
      const v = idx + 1;
      b.classList.toggle('on', v <= active);
      b.setAttribute('aria-checked', String(v === state.rating));
      b.setAttribute('aria-label', v + ' / 5');
    });
    $('ratingLabel').textContent = active ? t().ratings[active] : '';
  }

  function setRating(n) {
    state.rating = n;
    paintStars();
    const btn = starsEl.children[n - 1];
    btn.classList.remove('pop'); void btn.offsetWidth; btn.classList.add('pop');
    renderReviewState(true);
  }

  /* One review per table per device within CONFIG.reviewLockHours (light, client-side only) */
  const LOCK_KEY = 'ikatna_review_' + (TABLE || 'x');
  function isLocked() {
    try {
      const ts = Number(localStorage.getItem(LOCK_KEY));
      return !!ts && Date.now() - ts < CONFIG.reviewLockHours * 3600 * 1000;
    } catch (e) { return false; }
  }
  function lockReview() { try { localStorage.setItem(LOCK_KEY, String(Date.now())); } catch (e) {} }

  function renderReviewState(animate) {
    const locked = isLocked();
    $('reviewLocked').classList.toggle('hidden', !locked);
    $('reviewFlow').classList.toggle('hidden', locked);
    if (locked) return;
    const r = state.rating;
    const pos = $('positive'), neg = $('negative');
    pos.classList.toggle('hidden', !(r >= 4));
    neg.classList.toggle('hidden', !(r >= 1 && r <= 3));
    if (animate) {
      const shown = r >= 4 ? pos : (r >= 1 ? neg : null);
      if (shown) {
        shown.classList.remove('fade-up'); void shown.offsetWidth; shown.classList.add('fade-up');
        setTimeout(() => shown.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 80);
      }
    }
  }

  function renderChips() {
    const wrap = $('chips');
    wrap.innerHTML = '';
    CHIP_KEYS.forEach((k) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip rounded-full px-4 py-2.5 text-sm font-semibold';
      b.textContent = t().chips[k];
      b.setAttribute('aria-pressed', String(state.tags.has(k)));
      b.addEventListener('click', () => {
        state.tags.has(k) ? state.tags.delete(k) : state.tags.add(k);
        b.setAttribute('aria-pressed', String(state.tags.has(k)));
      });
      wrap.appendChild(b);
    });
  }

  /* ---------- WhatsApp: pre-filled message to the manager ---------- */
  function buildWhatsAppUrl() {
    const L = t(), M = L.msg;
    const issues = [...state.tags].map((k) => '• ' + L.chips[k]).join('\n') || M.none;
    const waiter = $('waiterName').value.trim().slice(0, 40) || M.none;
    const comment = $('comment').value.trim() || M.none;
    const lines = [
      M.head, '',
      '🏪 ' + M.restaurant + ': ' + CONFIG.restaurantName[state.lang],
      '🪑 ' + M.table + ': ' + (TABLE || M.none),
      '⭐ ' + M.rating + ': ' + state.rating + '/5',
      '🧑‍🍳 ' + M.waiter + ': ' + waiter,
      '⚠️ ' + M.issues + ':', issues,
      '💬 ' + M.comment + ': ' + comment
    ];
    if (cartCount()) {                       // lets the manager check "wrong order" complaints against the real order
      lines.push('🧾 ' + M.order + ':');
      cart.forEach((q, id) => lines.push('  ' + q + 'x ' + byId[id].qrName));
    }
    return 'https://wa.me/' + CONFIG.whatsappNumber + '?text=' + encodeURIComponent(lines.join('\n'));
  }

  $('waBtn').addEventListener('click', () => {
    window.open(buildWhatsAppUrl(), '_blank', 'noopener');
    lockReview();
    setTimeout(() => renderReviewState(false), 400);
  });
  $('mapsBtn').addEventListener('click', () => {
    lockReview();
    setTimeout(() => renderReviewState(false), 400);
  });

  /* =========================================================
     EVENTS + INIT
     ========================================================= */
  document.querySelectorAll('#langSwitch button').forEach((b) => b.addEventListener('click', () => applyLang(b.dataset.lang)));
  $('tabBtnMenu').addEventListener('click', () => setTab('menu'));
  $('tabBtnReview').addEventListener('click', () => setTab('review'));

  (function init() {
    let lang = null;
    try { lang = localStorage.getItem('ikatna_lang'); } catch (e) {}
    if (!I18N[lang]) {
      const nav = (navigator.language || '').slice(0, 2).toLowerCase();
      lang = I18N[nav] ? nav : 'ar';
    }
    loadCart();
    setTab('menu');
    applyLang(lang);
  })();
})();
</script>
</body>
</html>
