<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f7ebe4" />
<title>Ikatna – Menu & Avis</title>

<!-- Fonts: Playfair Display (titles), Cairo (Arabic), Inter (Latin), Bitcount Single (Ikatna wordmark) -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bitcount+Single:wght@100..900&family=Cairo:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600;1,700&display=swap" rel="stylesheet" />
<!-- qrcode.js (order QR for the waiter) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
  /* =====================================================================
     DESIGN TOKENS – cream / dark green / sand gold (Moroccan restaurant)
     ===================================================================== */
  :root {
    --cream: #f7ebe4;  --card: #fcf6f1;  --ink: #1f1a17;  --muted: #6f625a;
    --green: #123d2e;  --green2: #1d5a43; --sand: #ebc474;  --gold: #b8892f;
    --terra: #a4492b;  --red: #c1272d;    --line: rgba(80, 50, 30, .13);
    --shadow: 0 8px 22px rgba(90, 55, 30, .13);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--cream); color: var(--ink); -webkit-font-smoothing: antialiased; }

  /* font rules */
  html[lang="ar"] body { font-family: 'Cairo', sans-serif; }
  html[lang="fr"] body, html[lang="en"] body { font-family: 'Inter', sans-serif; }
  .font-display { font-family: 'Playfair Display', 'Cairo', serif; }

  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
  button:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible { outline: 2px solid var(--green2); outline-offset: 2px; }
  [hidden] { display: none !important; }
  .num { direction: ltr; unicode-bidi: isolate; }

  /* soft watercolour page background + faint restaurant icons */
  .page-bg { position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(60% 40% at 0% 30%,  rgba(236, 196, 160, .45), transparent 70%),
      radial-gradient(60% 40% at 100% 70%, rgba(222, 170, 150, .35), transparent 70%),
      radial-gradient(50% 30% at 50% 100%, rgba(18, 61, 46, .08), transparent 70%),
      var(--cream); }
  .page-bg svg { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .11; }

  .app { max-width: 760px; margin: 0 auto; min-height: 100vh; padding-bottom: 104px; }

  /* =====================================================================
     HERO
     ===================================================================== */
  .hero { position: relative; height: 262px; overflow: hidden; background: linear-gradient(135deg, #5c2f19 0%, #2b150c 70%); border-radius: 0 0 26px 26px; }
  .hero::before { content: ''; position: absolute; inset: 0;
    background: radial-gradient(40% 45% at 16% 66%, rgba(255, 170, 70, .45), transparent 70%); }
  .hero-photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .85; }   /* optional CONFIG.heroImage */
  .hero-zellige { position: absolute; right: 0; bottom: 78px; width: 58%; height: 100px; opacity: .9;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 45%); mask-image: linear-gradient(90deg, transparent, #000 45%); }
  .hero-blob { position: absolute; top: 0; left: 0; width: 100%; height: 178px; filter: drop-shadow(0 6px 10px rgba(0, 0, 0, .25)); }
  .hero-lantern { position: absolute; left: 12px; top: 40px; width: 66px; transform-origin: 50% 0; animation: sway 7s ease-in-out infinite alternate; }
  @keyframes sway { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }
  .hero-tagine { position: absolute; left: -10px; bottom: 6px; width: 200px; }
  .hero-title { position: absolute; top: 14px; left: 0; right: 0; text-align: center; padding: 0 92px; }
  .hero-title .hat { width: 44px; height: 40px; color: var(--ink); }
  .hero-title .type { font-family: 'Playfair Display', 'Cairo', serif; font-style: italic; font-weight: 700; font-size: 34px; line-height: 1.02; color: var(--ink); margin: 0; }
  .hero-title .name { font-family: 'Playfair Display', 'Cairo', serif; font-style: italic; font-weight: 700; font-size: 22px; line-height: 1.15; margin: 2px 0 0;
    background: linear-gradient(100deg, #9a6d1b, #d7a741 55%, #9a6d1b); -webkit-background-clip: text; background-clip: text; color: transparent; }
  html[lang="ar"] .hero-title .type, html[lang="ar"] .hero-title .name { font-style: normal; }
  .hero-tag { position: absolute; right: 16px; bottom: 30px; width: 55%; color: #fff; text-align: start; text-shadow: 0 2px 8px rgba(0, 0, 0, .55); }
  .hero-tag p { margin: 0; font-weight: 700; font-size: 15px; line-height: 1.3; }
  .hero-tag p + p { margin-top: 4px; font-size: 15px; color: #ffe7b3; }
  .hero-swoosh { position: absolute; right: 22px; bottom: 12px; width: 52%; height: 14px; }

  .langsw { position: absolute; top: 14px; right: 14px; display: inline-flex; border: 1.5px solid var(--green); border-radius: 999px; background: rgba(252, 246, 241, .92); padding: 2px; z-index: 3; }
  .langsw button { padding: 6px 11px; border-radius: 999px; font-size: 12px; font-weight: 700; color: var(--green); }
  .langsw button[aria-pressed="true"] { background: var(--green); color: #fff; }

  .table-chip { position: absolute; left: 14px; top: 14px; z-index: 3; display: inline-flex; align-items: center; gap: 6px;
    background: rgba(252, 246, 241, .92); border: 1.5px solid var(--green); color: var(--green); border-radius: 999px; padding: 5px 10px; font-size: 12px; font-weight: 700; }
  .table-chip b { font-family: 'Playfair Display', serif; font-size: 15px; }
  .table-chip svg { width: 13px; height: 13px; }
  .table-chip.empty { animation: pulse 1.8s ease-in-out infinite; background: var(--sand); }
  @keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(235, 196, 116, .45); } }

  /* =====================================================================
     CATEGORY PILLS (bilingual, two lines)
     ===================================================================== */
  .pills { display: flex; gap: 10px; overflow-x: auto; padding: 16px 16px 6px; scrollbar-width: none; scroll-snap-type: x proximity; }
  .pills::-webkit-scrollbar { display: none; }
  .pill { flex: 0 0 auto; scroll-snap-align: start; min-width: 74px; padding: 9px 16px; border-radius: 18px; background: #f0dccf; color: var(--ink); text-align: center; line-height: 1.25; transition: background .18s, color .18s; }
  .pill span { display: block; font-size: 13px; font-weight: 600; }
  .pill span + span { font-size: 13px; font-weight: 600; opacity: .85; }
  .pill[aria-pressed="true"] { background: var(--green); color: #fff; box-shadow: 0 6px 16px rgba(18, 61, 46, .3); }

  /* =====================================================================
     DISH CARDS (horizontal)
     ===================================================================== */
  .list { display: grid; gap: 14px; padding: 12px 16px 6px; }
  @media (min-width: 640px) { .list { grid-template-columns: 1fr 1fr; } }
  .sec-title { grid-column: 1 / -1; margin: 10px 2px 0; font-family: 'Playfair Display', 'Cairo', serif; font-size: 22px; font-weight: 700; color: var(--green); display: flex; align-items: center; gap: 10px; }
  .sec-title::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--gold), transparent); opacity: .5; }

  .card { background: var(--card); border-radius: 22px; box-shadow: var(--shadow); border: 1px solid rgba(255, 255, 255, .7); overflow: hidden; }
  .card-top { display: flex; gap: 12px; padding: 11px; align-items: stretch; }
  .thumbbox { position: relative; flex: 0 0 112px; height: 104px; border-radius: 16px; overflow: hidden; background: linear-gradient(135deg, #b9582f, #6a2c16); }
  .thumbbox img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .thumbbox .ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: rgba(255, 233, 200, .75); }
  .thumbbox .ph svg { width: 54px; height: 54px; }
  .ctl { position: absolute; left: 0; right: 0; bottom: 6px; display: flex; justify-content: center; }
  .plus { width: 34px; height: 34px; border-radius: 50%; background: var(--green); color: #fff; font-size: 22px; line-height: 1; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(0, 0, 0, .35); border: 2px solid #fff; }
  .step { display: inline-flex; align-items: center; background: var(--green); color: #fff; border-radius: 999px; padding: 2px; box-shadow: 0 4px 12px rgba(0, 0, 0, .35); border: 2px solid #fff; }
  .step button { width: 28px; height: 28px; border-radius: 50%; font-size: 18px; line-height: 1; display: flex; align-items: center; justify-content: center; }
  .step button:active { background: rgba(255, 255, 255, .2); }
  .step b { min-width: 24px; text-align: center; font-size: 14px; }

  .card-main { flex: 1; min-width: 0; text-align: start; display: flex; flex-direction: column; justify-content: center; gap: 2px; }
  .n1 { margin: 0; font-size: 17px; font-weight: 700; line-height: 1.2; }
  .n2 { margin: 0; font-size: 15px; font-weight: 600; line-height: 1.25; color: #2d2723; }
  .meta { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 13px; color: var(--muted); white-space: nowrap; }
  .meta i { width: 1px; height: 14px; background: #b9a99d; }
  .meta svg { width: 15px; height: 15px; vertical-align: -3px; margin-inline-end: 3px; }
  .meta .fl { color: #f08a3c; } .meta .dm { color: #8a7d74; }

  .side { flex: 0 0 auto; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-end; }
  .chev { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border-radius: 50%; color: var(--ink); transition: transform .2s; }
  .chev svg { width: 18px; height: 18px; }
  html[dir="rtl"] .chev svg { transform: scaleX(-1); }
  .card.open .chev { transform: rotate(90deg); }
  .price { background: var(--sand); color: #2b1c05; font-weight: 800; font-size: 17px; border-radius: 999px; padding: 6px 15px; white-space: nowrap; box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .06); }

  .more { padding: 0 14px 14px; border-top: 1px dashed var(--line); margin: 0 11px; padding-top: 10px; }
  .more .desc { margin: 0; font-size: 14px; line-height: 1.5; color: #43372f; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .badge { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: #efe1d6; color: #5b4a3f; }
  .badge.ok { background: #d9eddf; color: #1c5a35; } .badge.heart { background: #f6dcdd; color: #9c2b33; }
  .ing-t { margin: 12px 0 4px; font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--gold); }
  .ing { margin: 0; font-size: 13px; line-height: 1.55; color: #5b4a3f; }
  .note { margin: 18px 22px 0; text-align: center; font-size: 12px; line-height: 1.6; color: var(--muted); }

  /* =====================================================================
     REVIEW
     ===================================================================== */
  .panel-pad { padding: 18px 16px 0; max-width: 560px; margin: 0 auto; }
  .box { background: var(--card); border-radius: 24px; box-shadow: var(--shadow); padding: 20px; border: 1px solid rgba(255, 255, 255, .7); }
  .box + .box { margin-top: 14px; }
  .box h2 { margin: 0; font-family: 'Playfair Display', 'Cairo', serif; font-size: 24px; text-align: center; color: var(--green); }
  .box .sub { margin: 6px 0 0; text-align: center; font-size: 14px; color: var(--muted); }
  .lbl { display: block; margin: 18px 0 6px; font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--gold); }
  .field { width: 100%; border: 1.5px solid var(--line); background: #fff; border-radius: 14px; padding: 12px 14px; font: inherit; font-size: 15px; color: var(--ink); }
  .field:focus { border-color: var(--green2); }
  textarea.field { resize: none; }
  .stars { display: flex; justify-content: center; gap: 4px; margin-top: 20px; direction: ltr; }
  .star { padding: 3px; transition: transform .15s; }
  .star:active { transform: scale(.85); }
  .star svg { width: 44px; height: 44px; fill: transparent; stroke: #cdbbae; stroke-width: 1.6; stroke-linejoin: round; transition: fill .2s, stroke .2s; }
  .star.on svg { fill: #e2a92f; stroke: #c98d10; filter: drop-shadow(0 2px 6px rgba(226, 169, 47, .5)); }
  .rlabel { height: 24px; margin: 8px 0 0; text-align: center; font-weight: 700; color: var(--green); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { padding: 9px 14px; border-radius: 999px; background: #f0dccf; font-size: 14px; font-weight: 600; border: 1.5px solid transparent; transition: all .15s; }
  .chip[aria-pressed="true"] { background: var(--green); color: #fff; }

  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; border-radius: 16px; padding: 14px 18px; font-weight: 800; font-size: 16px; transition: transform .15s, opacity .2s; text-decoration: none; }
  .btn:active { transform: scale(.98); }
  .btn svg { width: 20px; height: 20px; }
  .btn.green { background: var(--green); color: #fff; box-shadow: 0 8px 20px rgba(18, 61, 46, .3); }
  .btn.sand  { background: var(--sand); color: #2b1c05; box-shadow: 0 8px 20px rgba(184, 137, 47, .3); }
  .btn.wa    { background: #25d366; color: #0b2b16; box-shadow: 0 8px 20px rgba(37, 211, 102, .3); }
  .btn.ghost { background: #efe1d6; color: var(--ink); }
  .btn.danger { background: #f8dede; color: #9c2b33; border: 1.5px solid #e8b4b7; }
  .btn.danger.armed { background: var(--red); color: #fff; border-color: var(--red); }
  .link { display: block; margin-top: 14px; text-align: center; font-size: 13px; color: var(--muted); text-decoration: underline; text-underline-offset: 4px; }
  .hint { margin: 10px 0 0; text-align: center; font-size: 12px; color: var(--muted); }
  .emoji-badge { width: 58px; height: 58px; margin: 0 auto 10px; border-radius: 50%; background: #efe1d6; display: flex; align-items: center; justify-content: center; font-size: 30px; }
  .pop { animation: pop .35s cubic-bezier(.2, 1.4, .4, 1); }
  @keyframes pop { from { transform: scale(.6); } to { transform: scale(1); } }
  .fade-up { animation: fadeUp .4s ease both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

  .foot { margin: 26px 0 0; text-align: center; font-size: 12px; color: var(--muted); }
  .brand-font { font-family: 'Bitcount Single', 'Inter', monospace; font-weight: 600; letter-spacing: .12em; font-size: 12px; color: var(--gold); direction: ltr; unicode-bidi: isolate; display: inline-block; }
  .brand-font .w { color: var(--ink); }

  /* =====================================================================
     BOTTOM NAV
     ===================================================================== */
  .bnav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--green); border-radius: 24px 24px 0 0; padding: 8px 10px max(10px, env(safe-area-inset-bottom)); box-shadow: 0 -8px 26px rgba(0, 0, 0, .22);
    display: grid; grid-template-columns: repeat(4, 1fr); max-width: 760px; margin: 0 auto; }
  .bnav button { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; color: rgba(255, 255, 255, .72); font-size: 11px; font-weight: 600; }
  .bnav svg { width: 25px; height: 25px; }
  .bnav button[aria-current="page"] { color: var(--sand); }
  .bnav .badge-n { position: absolute; top: 0; inset-inline-start: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--red); color: #fff; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center; }

  /* =====================================================================
     SHEETS (order + QR, table number)
     ===================================================================== */
  .overlay { position: fixed; inset: 0; z-index: 60; display: flex; align-items: flex-end; justify-content: center; background: rgba(25, 14, 8, .6); backdrop-filter: blur(3px); }
  .sheet { width: 100%; max-width: 480px; max-height: 92vh; overflow-y: auto; background: var(--cream); border-radius: 26px 26px 0 0; padding: 12px 20px max(22px, env(safe-area-inset-bottom)); animation: fadeUp .3s ease both; }
  @media (min-width: 560px) { .overlay { align-items: center; } .sheet { border-radius: 26px; } }
  .grab { width: 44px; height: 5px; border-radius: 3px; background: #d6c3b6; margin: 0 auto 14px; }
  .sheet h2 { margin: 0; text-align: center; font-family: 'Playfair Display', 'Cairo', serif; font-size: 26px; color: var(--green); }
  .sheet .sub { margin: 4px 0 0; text-align: center; font-size: 14px; color: var(--muted); }
  .sheet .sub b { color: var(--green); }
  .empty { text-align: center; padding: 28px 10px; color: var(--muted); font-size: 15px; }
  .olist { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 10px; }
  .olist li { display: flex; align-items: center; gap: 10px; background: var(--card); border-radius: 16px; padding: 10px 12px; box-shadow: 0 2px 8px rgba(90, 55, 30, .08); }
  .olist .nm { flex: 1; min-width: 0; font-weight: 600; font-size: 14px; }
  .olist .lp { font-weight: 700; font-size: 14px; white-space: nowrap; }
  .olist .step { box-shadow: none; border: 0; }
  .total { display: flex; justify-content: space-between; align-items: center; margin: 14px 4px 0; font-weight: 700; }
  .total b { font-family: 'Playfair Display', serif; font-size: 24px; color: var(--green); }
  .qrwrap { width: fit-content; margin: 16px auto 0; padding: 14px; background: #fff; border-radius: 20px; box-shadow: var(--shadow); }
  #qrBox { width: 216px; height: 216px; display: flex; align-items: center; justify-content: center; direction: ltr; }
  #qrBox img, #qrBox canvas { max-width: 100%; height: auto; }
  .err { color: #9c2b33; font-size: 13px; text-align: center; margin: 8px 0 0; }
  .sheet .btn { margin-top: 12px; }
  .row { display: flex; gap: 8px; }
  .row .field { text-align: center; font-family: 'Playfair Display', serif; font-weight: 700; font-size: 22px; letter-spacing: .14em; text-transform: uppercase; direction: ltr; }
  .row .btn { width: auto; margin: 0; padding: 0 22px; }

  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { animation: none !important; transition: none !important; } }
</style>
</head>

<body>
<!-- soft background: watercolour glows + faint restaurant icons -->
<div class="page-bg" aria-hidden="true">
  <svg focusable="false">
    <defs>
      <pattern id="ico" width="210" height="210" patternUnits="userSpaceOnUse" patternTransform="rotate(-10)">
        <g fill="none" stroke="#a9794a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <g transform="translate(16 18)"><path d="M3 36h42M8 36a16 16 0 0 1 32 0M24 20v-4M21 16h6M0 40h48"/></g>
          <g transform="translate(128 12) rotate(-18 24 24)"><g transform="scale(2)" stroke-width=".75"><path d="M7 3v8a2 2 0 0 0 2 2v8M5 3v5M9 3v5M17 3c-2 2-3 5-3 8h3v10"/></g></g>
          <g transform="translate(70 78)"><circle cx="24" cy="24" r="19"/><circle cx="24" cy="24" r="11.5"/></g>
          <g transform="translate(10 128)"><path d="M13 40V30a9 9 0 0 1-4-17 11 11 0 0 1 20-4 10 10 0 0 1 8 18 9 9 0 0 1-2 3v10Z"/><path d="M13 35h26"/></g>
          <g transform="translate(132 126)"><path d="M13 20h22l-3 24H16Z"/><path d="M11 20h26M14 30h20"/><path d="M24 20c-3-5-2-10 3-13 1 5 0 9-3 13ZM24 20c-5-2-9-1-11-6 5-1 9 1 11 6Z"/></g>
        </g>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#ico)"/>
  </svg>
</div>

<div class="app">

  <!-- ================================================== HERO -->
  <header class="hero">
    <img id="heroPhoto" class="hero-photo" alt="" hidden />

    <!-- gold zellige band -->
    <svg class="hero-zellige" viewBox="0 0 220 100" preserveAspectRatio="xMaxYMid slice" aria-hidden="true" focusable="false">
      <defs>
        <g id="kh" fill="none" stroke="#e3b24c" stroke-width="1.4" stroke-linejoin="round"><rect x="-13" y="-13" width="26" height="26"/><rect x="-13" y="-13" width="26" height="26" transform="rotate(45)"/><circle r="4.5"/></g>
        <pattern id="zl" width="52" height="52" patternUnits="userSpaceOnUse"><use href="#kh" x="26" y="26"/><use href="#kh" x="0" y="0"/><use href="#kh" x="52" y="0"/><use href="#kh" x="0" y="52"/><use href="#kh" x="52" y="52"/></pattern>
      </defs>
      <rect width="220" height="100" fill="url(#zl)"/>
    </svg>

    <!-- cream brush blob behind the title -->
    <svg class="hero-blob" viewBox="0 0 390 178" preserveAspectRatio="none" aria-hidden="true" focusable="false">
      <path d="M0 0H390V104C372 96 352 112 330 124C300 140 276 150 244 144C212 138 196 118 160 130C126 142 108 168 70 160C40 154 20 136 0 138Z" fill="#f9efe9"/>
      <path d="M0 0H390V96C366 90 350 104 326 114C298 126 272 132 240 128" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="3"/>
    </svg>

    <!-- lantern -->
    <svg class="hero-lantern" viewBox="0 0 60 122" fill="none" aria-hidden="true" focusable="false">
      <defs><radialGradient id="lgl"><stop offset="0" stop-color="#ffcf6a" stop-opacity=".75"/><stop offset="1" stop-color="#ffcf6a" stop-opacity="0"/></radialGradient></defs>
      <path d="M30 0V22" stroke="#7a5a2a" stroke-width="1.6"/>
      <circle cx="30" cy="70" r="40" fill="url(#lgl)"/>
      <g stroke="#3a2412" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
        <circle cx="30" cy="25" r="3.6" fill="#8a6428"/>
        <path d="M30 29L45 46H15Z" fill="#6a4a22"/>
        <path d="M17 46H43L47 86H13Z" fill="#ffb347"/>
        <path d="M23 53H37L39 79H21Z" fill="#fff0b8"/>

  /* =====================================================================
     HELPERS / STATE
     ===================================================================== */
  const $ = (id) => document.getElementById(id);
  const t = () => I18N[state.lang];
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = (n) => new Intl.NumberFormat(t().locale).format(n);
  const money = (n) => fmt(n) + ' ' + t().cur;
  const byId = Object.fromEntries(MENU.map((d) => [d.id, d]));
  const second = () => (state.lang === 'ar' ? 'fr' : 'ar');         // second (smaller) name under the main one

  const state = { lang: 'fr', tab: 'menu', cat: 'all', rating: 0, hover: 0, tags: new Set() };
  const cart = new Map();
  const openCards = new Set();
  let table = null, pendingOrder = false, qrRef = '', armed = false, armTimer = null, lastFocus = null;

  const ICO = {
    flame: '<svg class="fl" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.5 2c.5 3-1 4.7-2.5 6.4C8.5 10 7 11.7 7 14.3A5.3 5.3 0 0 0 12.3 20c3 0 5.7-2.2 5.7-5.7 0-2.1-1-3.6-2-4.9-.3 1.2-.9 2-1.8 2.4.5-3.6-.2-7.3-1.7-9.8Z"/></svg>',
    bell: '<svg class="dm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M3 9v6M6.5 6v12M17.5 6v12M21 9v6M6.5 12h11"/></svg>',
    chev: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>',
    ph: '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 30h36l-3 8H9zM12 30c0-9 5-16 12-16s12 7 12 16M24 14v-4M21 10h6"/></svg>'
  };

  /* ---------- table number ---------- */
  const cleanTable = (raw) => { const v = String(raw == null ? '' : raw).trim(); return /^[A-Za-z0-9-]{1,6}$/.test(v) ? v.toUpperCase() : null; };
  try { table = cleanTable(new URLSearchParams(location.search).get('table')); } catch (e) {}
  const normalizeTable = (s) => String(s).replace(/[٠-٩]/g, (d) => d.charCodeAt(0) - 0x0660).replace(/[۰-۹]/g, (d) => d.charCodeAt(0) - 0x06F0).toUpperCase().replace(/[^A-Z0-9-]/g, '');

  /* ---------- cart ---------- */
  const CART_KEY = 'ikatna_cart';
  const saveCart = () => { try { sessionStorage.setItem(CART_KEY, JSON.stringify([...cart])); } catch (e) {} };
  (function loadCart() { try { JSON.parse(sessionStorage.getItem(CART_KEY) || '[]').forEach(([id, q]) => { if (byId[id] && Number.isInteger(q) && q > 0 && q < 100) cart.set(id, q); }); } catch (e) {} })();
  const cartCount = () => [...cart.values()].reduce((a, b) => a + b, 0);
  const cartTotal = () => [...cart].reduce((s, [id, q]) => s + byId[id].price * q, 0);

  /* =====================================================================
     RENDER – language / hero / nav
     ===================================================================== */
  function applyLang(lang) {
    state.lang = lang;
    const L = t();
    document.documentElement.lang = L.lang;
    document.documentElement.dir = L.dir;
    document.querySelectorAll('#langSwitch button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));

    $('restType').textContent = CONFIG.restaurantType[lang];
    $('restName').textContent = CONFIG.restaurantName[lang];
    $('tag1').textContent = L.tag1; $('tag2').textContent = L.tag2;
    const set = (id, v) => { $(id).textContent = v; };
    set('navMenu', L.navMenu); set('navOrder', L.navOrder); set('navRate', L.navRate); set('navTable', L.navTable);
    set('nutriNote', L.nutri); set('poweredBy', L.poweredBy); set('poweredBy2', L.poweredBy);
    // review
    set('reviewTitle', L.reviewTitle); set('reviewSub', L.reviewSub); set('waiterLabel', L.waiterLabel);
    set('posTitle', L.posTitle); set('posText', L.posText); set('mapsLabel', L.mapsBtn);
    set('negTitle', L.negTitle); set('negText', L.negText); set('chipsLabel', L.chipsLabel); set('commentLabel', L.commentLabel);
    set('waLabel', L.waBtn); set('waHint', L.waHint); set('publicLink', L.publicLink); set('lockedTitle', L.lockedTitle); set('lockedText', L.lockedText);
    $('waiterName').placeholder = L.waiterPh; $('comment').placeholder = L.commentPh;
    $('mapsBtn').href = CONFIG.googleMapsReviewUrl; $('publicLink').href = CONFIG.googleMapsReviewUrl;
    // sheets
    set('orderTitle', L.orderTitle); set('oEmpty', L.empty); set('oTotalLbl', L.total); set('qrHint', L.qrHint); set('oClose', L.close);
    set('tableTitle', L.tableTitle); set('tableMsg', L.tableAsk); set('tableOk', L.tableOk); set('tableClose', L.close); $('tableInput').placeholder = L.tablePh;
    renderTable(); renderPills(); renderMenu(); renderChips(); paintStars(); renderCart();
    if (!$('orderSheet').hidden) renderOrder(false);
    try { localStorage.setItem('ikatna_lang', lang); } catch (e) {}
  }

  function renderTable() {
    $('chipNum').textContent = table || '—';
    $('chipLbl').textContent = table ? t().table : t().enterTable;
    $('tableChip').classList.toggle('empty', !table);
    $('oTable').textContent = table || '—'; $('oTableLbl').textContent = t().table;
  }

  function setNav(tab) {
    state.tab = tab;
    $('panelMenu').hidden = tab !== 'menu';
    $('panelReview').hidden = tab !== 'review';
    document.querySelectorAll('#bnav [data-nav]').forEach((b) => {
      const on = (b.dataset.nav === 'menu' && tab === 'menu') || (b.dataset.nav === 'review' && tab === 'review');
      if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
    if (tab === 'review') renderReviewState();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  /* =====================================================================
     MENU
     ===================================================================== */
  function renderPills() {
    const wrap = $('pills');
    wrap.innerHTML = '';
    ['all', ...CATS].forEach((c) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'pill';
      b.innerHTML = '<span>' + esc(I18N[state.lang].cats[c]) + '</span><span>' + esc(I18N[second()].cats[c]) + '</span>';
      b.setAttribute('aria-pressed', String(state.cat === c));
      b.addEventListener('click', () => { state.cat = c; renderPills(); renderMenu(); });
      wrap.appendChild(b);
    });
  }

  function ctlHtml(id) {
    const u = t(), q = cart.get(id) || 0;
    if (!q) return '<button type="button" class="plus" data-act="inc" data-id="' + id + '" aria-label="' + esc(u.add) + '">+</button>';
    return '<div class="step"><button type="button" data-act="dec" data-id="' + id + '" aria-label="' + esc(u.less) + '">−</button><b class="num">' + fmt(q) + '</b>' +
           '<button type="button" data-act="inc" data-id="' + id + '" aria-label="' + esc(u.more) + '">+</button></div>';
  }

  function cardHtml(d) {
    const u = t(), A = d[state.lang], B = d[second()], open = openCards.has(d.id);
    return '<article class="card' + (open ? ' open' : '') + '" data-card="' + d.id + '">' +
      '<div class="card-top">' +
        '<div class="thumbbox"><div class="ph">' + ICO.ph + '</div>' +
          '<img src="' + esc(IMG(d.img)) + '" alt="' + esc(A.n) + '" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.remove()" />' +
          '<div class="ctl" data-ctl="' + d.id + '">' + ctlHtml(d.id) + '</div></div>' +
        '<button type="button" class="card-main" data-act="toggle" data-id="' + d.id + '" aria-expanded="' + open + '">' +
          '<h3 class="n1">' + esc(A.n) + '</h3><p class="n2">' + esc(B.n) + '</p>' +
          '<div class="meta"><span>' + ICO.flame + '<span class="num">' + fmt(d.kcal) + '</span> ' + esc(u.kcal) + '</span><i></i><span>' + ICO.bell + '<span class="num">' + fmt(d.protein) + '</span> g</span></div>' +
        '</button>' +
        '<div class="side"><button type="button" class="chev" data-act="toggle" data-id="' + d.id + '" aria-label="' + esc(u.details) + '">' + ICO.chev + '</button><span class="price">' + esc(money(d.price)) + '</span></div>' +
      '</div>' +
      '<div class="more"' + (open ? '' : ' hidden') + '>' +
        '<p class="desc">' + esc(A.d) + '</p>' +
        '<div class="badges">' + (d.diabetic ? '<span class="badge ok">✓ ' + esc(u.diabetic) + '</span>' : '') + (d.lowChol ? '<span class="badge heart">♥ ' + esc(u.lowChol) + '</span>' : '') + '</div>' +
        '<p class="ing-t">' + esc(u.ing) + '</p><p class="ing">' + A.i.map(esc).join(' · ') + '</p>' +
      '</div></article>';
  }

  function renderMenu() {
    const cats = state.cat === 'all' ? CATS : [state.cat];
    $('menuRoot').innerHTML = cats.map((c) =>
      (state.cat === 'all' ? '<h2 class="sec-title">' + esc(t().cats[c]) + '</h2>' : '') +
      MENU.filter((d) => d.cat === c).map(cardHtml).join('')).join('');
  }

  $('menuRoot').addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const id = b.dataset.id, act = b.dataset.act;
    if (!byId[id]) return;
    if (act === 'toggle') {
      const card = b.closest('.card'), open = !openCards.has(id);
      open ? openCards.add(id) : openCards.delete(id);
      card.classList.toggle('open', open);
      card.querySelector('.more').hidden = !open;
      card.querySelector('.card-main').setAttribute('aria-expanded', String(open));
      return;
    }
    changeQty(id, act === 'dec' ? -1 : 1);
  });

  function changeQty(id, delta) {
    const next = (cart.get(id) || 0) + delta;
    if (next <= 0) cart.delete(id); else cart.set(id, Math.min(next, 20));
    saveCart();
    const box = document.querySelector('[data-ctl="' + id + '"]');
    if (box) box.innerHTML = ctlHtml(id);
    renderCart();
    if (!$('orderSheet').hidden) renderOrder(true);
  }

  function renderCart() {
    const n = cartCount();
    $('cartBadge').hidden = !n;
    $('cartBadge').textContent = fmt(n);
    if (!n && armed) setArmed(false);
  }

  /* =====================================================================
     SHEETS
     ===================================================================== */
  function openSheet(id) { lastFocus = document.activeElement; $(id).hidden = false; document.body.style.overflow = 'hidden'; }
  function closeSheet(id) {
    $(id).hidden = true;
    if ($('orderSheet').hidden && $('tableSheet').hidden) document.body.style.overflow = '';
    if (lastFocus && lastFocus.focus) { try { lastFocus.focus(); } catch (e) {} }
  }
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') ['tableSheet', 'orderSheet'].forEach((s) => { if (!$(s).hidden) closeSheet(s); }); });
  ['orderSheet', 'tableSheet'].forEach((s) => $(s).addEventListener('click', (e) => { if (e.target === $(s)) closeSheet(s); }));

  /* ---------- table number ---------- */
  function openTable(message) {
    $('tableMsg').textContent = message || t().tableAsk;
    $('tableErr').hidden = true;
    $('tableInput').value = table || '';
    openSheet('tableSheet');
    setTimeout(() => { $('tableInput').focus(); $('tableInput').select(); }, 120);
  }
  function confirmTable() {
    const v = cleanTable(normalizeTable($('tableInput').value));
    if (!v) { $('tableErr').textContent = t().tableInvalid; $('tableErr').hidden = false; $('tableInput').focus(); return; }
    table = v;
    try { history.replaceState(null, '', '?table=' + encodeURIComponent(v)); } catch (e) {}
    renderTable();
    closeSheet('tableSheet');
    if (state.tab === 'review') renderReviewState();
    if (pendingOrder) { pendingOrder = false; openOrder(); }
  }
  $('tableInput').addEventListener('input', (e) => { e.target.value = normalizeTable(e.target.value); $('tableErr').hidden = true; });
  $('tableInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); confirmTable(); } });
  $('tableOk').addEventListener('click', confirmTable);
  $('tableClose').addEventListener('click', () => { pendingOrder = false; closeSheet('tableSheet'); });
  $('tableChip').addEventListener('click', () => openTable());

  /* ---------- order + QR ---------- */
  function newRef() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    const r = (window.crypto && crypto.getRandomValues) ? crypto.getRandomValues(new Uint8Array(4)) : [1, 2, 3, 4].map(() => Math.floor(Math.random() * 256));
    return Array.from(r, (x) => chars[x % chars.length]).join('');
  }
  function orderText() {
    const d = new Date(), hh = String(d.getHours()).padStart(2, '0'), mm = String(d.getMinutes()).padStart(2, '0');
    const lines = ['IKATNA ORDER', 'TABLE: ' + (table || 'UNKNOWN'), 'REF: ' + qrRef + ' ' + hh + ':' + mm, '------'];
    cart.forEach((q, id) => lines.push(q + 'x ' + byId[id].qr));
    lines.push('------', 'ITEMS: ' + cartCount(), 'TOTAL: ' + cartTotal() + ' ' + CONFIG.currencyCode);
    return lines.join('\n');
  }

  function renderOrder(regenQr) {
    const u = t(), has = cartCount() > 0;
    $('oEmpty').hidden = has; $('oFull').hidden = !has;
    $('oTable').textContent = table || '—'; $('oRef').textContent = '#' + qrRef;
    $('oList').innerHTML = [...cart].map(([id, q]) =>
      '<li><span class="nm">' + esc(byId[id][state.lang].n) + '</span>' +
      '<div class="step"><button type="button" data-act="dec" data-id="' + id + '" aria-label="' + esc(u.less) + '">−</button><b class="num">' + fmt(q) + '</b><button type="button" data-act="inc" data-id="' + id + '" aria-label="' + esc(u.more) + '">+</button></div>' +
      '<span class="lp">' + esc(money(byId[id].price * q)) + '</span></li>').join('');
    $('oTotal').textContent = money(cartTotal());
    $('oCancel').textContent = armed ? u.cancelSure : u.cancelNew;
    $('oCancel').classList.toggle('armed', armed);
    if (!has || !regenQr) return;
    const box = $('qrBox'), err = $('qrError');
    box.innerHTML = ''; err.hidden = true;
    const text = orderText();
    try {
      if (typeof QRCode === 'undefined') throw new Error('qrcode.js not loaded');
      new QRCode(box, { text: text, width: 216, height: 216, colorDark: '#123d2e', colorLight: '#ffffff', correctLevel: text.length > 900 ? QRCode.CorrectLevel.L : QRCode.CorrectLevel.M });
    } catch (e) { err.textContent = u.qrFail; err.hidden = false; }
  }

  function openOrder() {
    if (cartCount() && !table) { pendingOrder = true; openTable(t().tableNeeded); return; }   // the waiter needs the table number
    setArmed(false);
    qrRef = newRef();
    openSheet('orderSheet');
    renderOrder(true);
  }
  $('oList').addEventListener('click', (e) => { const b = e.target.closest('[data-act]'); if (b && byId[b.dataset.id]) changeQty(b.dataset.id, b.dataset.act === 'dec' ? -1 : 1); });
  $('oClose').addEventListener('click', () => { setArmed(false); closeSheet('orderSheet'); });

  /* cancel & start new: first tap asks, second tap clears */
  function setArmed(on) {
    armed = on; clearTimeout(armTimer);
    if (on) armTimer = setTimeout(() => setArmed(false), 4000);
    if (!$('orderSheet').hidden) renderOrder(false);
  }
  $('oCancel').addEventListener('click', () => {
    if (!armed) { setArmed(true); return; }
    cart.clear(); saveCart(); armed = false; clearTimeout(armTimer);
    closeSheet('orderSheet'); renderMenu(); renderCart();
  });

  /* ---------- bottom nav ---------- */
  document.querySelectorAll('#bnav [data-nav]').forEach((b) => b.addEventListener('click', () => {
    const n = b.dataset.nav;
    if (n === 'menu' || n === 'review') setNav(n);
    else if (n === 'order') openOrder();
    else if (n === 'table') openTable();
  }));
  document.querySelectorAll('#langSwitch button').forEach((b) => b.addEventListener('click', () => applyLang(b.dataset.lang)));

  /* =====================================================================
     REVIEW
     ===================================================================== */
  const starsEl = $('stars');
  const starSvg = '<svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.1 6.6.9-4.8 4.6 1.2 6.6L12 17.5l-5.9 3.2 1.2-6.6L2.5 9.5l6.6-.9L12 2.5z"/></svg>';
  for (let i = 1; i <= 5; i++) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'star'; b.setAttribute('role', 'radio'); b.setAttribute('aria-checked', 'false'); b.innerHTML = starSvg;
    b.addEventListener('click', () => setRating(i));
    b.addEventListener('mouseenter', () => { state.hover = i; paintStars(); });
    b.addEventListener('mouseleave', () => { state.hover = 0; paintStars(); });
    starsEl.appendChild(b);
  }
  function paintStars() {
    const a = state.hover || state.rating;
    [...starsEl.children].forEach((b, i) => { b.classList.toggle('on', i + 1 <= a); b.setAttribute('aria-checked', String(i + 1 === state.rating)); b.setAttribute('aria-label', (i + 1) + ' / 5'); });
    $('ratingLabel').textContent = a ? t().ratings[a] : '';
  }
  function setRating(n) { state.rating = n; paintStars(); renderReviewState(true); }

  const lockKey = () => 'ikatna_review_' + (table || 'x');
  function isLocked() { try { const ts = Number(localStorage.getItem(lockKey())); return !!ts && Date.now() - ts < CONFIG.reviewLockHours * 3600 * 1000; } catch (e) { return false; } }
  function lockReview() { try { localStorage.setItem(lockKey(), String(Date.now())); } catch (e) {} }

  function renderReviewState(animate) {
    const locked = isLocked();
    $('reviewLocked').hidden = !locked; $('reviewFlow').hidden = locked;
    if (locked) return;
    const r = state.rating;
    $('positive').hidden = !(r >= 4); $('negative').hidden = !(r >= 1 && r <= 3);
    const shown = r >= 4 ? $('positive') : (r >= 1 ? $('negative') : null);
    if (animate && shown) { shown.classList.remove('fade-up'); void shown.offsetWidth; shown.classList.add('fade-up'); setTimeout(() => shown.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 80); }
  }

  function renderChips() {
    const wrap = $('chips'); wrap.innerHTML = '';
    CHIP_KEYS.forEach((k) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'chip'; b.textContent = t().chips[k]; b.setAttribute('aria-pressed', String(state.tags.has(k)));
      b.addEventListener('click', () => { state.tags.has(k) ? state.tags.delete(k) : state.tags.add(k); b.setAttribute('aria-pressed', String(state.tags.has(k))); });
      wrap.appendChild(b);
    });
  }

  function waUrl() {
    const L = t(), M = L.msg;
    const issues = [...state.tags].map((k) => '• ' + L.chips[k]).join('\n') || M.none;
    const lines = [M.head, '', '🏪 ' + M.restaurant + ': ' + CONFIG.restaurantName[state.lang], '🪑 ' + M.table + ': ' + (table || M.none), '⭐ ' + M.rating + ': ' + state.rating + '/5',
      '🧑‍🍳 ' + M.waiter + ': ' + ($('waiterName').value.trim().slice(0, 40) || M.none), '⚠️ ' + M.issues + ':', issues, '💬 ' + M.comment + ': ' + ($('comment').value.trim() || M.none)];
    if (cartCount()) { lines.push('🧾 ' + M.order + ':'); cart.forEach((q, id) => lines.push('  ' + q + 'x ' + byId[id].qr)); }   // lets the manager check "wrong order" complaints
    return 'https://wa.me/' + CONFIG.whatsappNumber + '?text=' + encodeURIComponent(lines.join('\n'));
  }
  $('waBtn').addEventListener('click', () => { window.open(waUrl(), '_blank', 'noopener'); lockReview(); setTimeout(() => renderReviewState(false), 400); });
  $('mapsBtn').addEventListener('click', () => { lockReview(); setTimeout(() => renderReviewState(false), 400); });

  /* =====================================================================
     INIT
     ===================================================================== */
  (function init() {
    if (CONFIG.heroImage) { const h = $('heroPhoto'); h.src = CONFIG.heroImage; h.hidden = false; h.onerror = () => { h.hidden = true; }; }
    let lang = null;
    try { lang = localStorage.getItem('ikatna_lang'); } catch (e) {}
    if (!I18N[lang]) { const nav = (navigator.language || '').slice(0, 2).toLowerCase(); lang = I18N[nav] ? nav : 'fr'; }
    applyLang(lang);
    setNav('menu');
    window.scrollTo(0, 0);
  })();
})();
</script>
</body>
</html>
