<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#140c0e" />
<title>Le Palais Gourmand – Menu & Reviews</title>

<!-- Fonts: Playfair Display, Cairo, Inter -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet" />

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          morocco: {
            terra: '#8a3324',
            clay: '#3d1611',
            dark: '#140c0e',
            surface: '#241418',
            card: '#301c20'
          },
          gold: { 200: '#fffae0', 300: '#fce8a0', 400: '#e6c55c', 500: '#d4af37', 600: '#b08d24' }
        },
        fontFamily: {
          display: ['"Playfair Display"', 'Cairo', 'serif'],
          body: ['Inter', 'Cairo', 'system-ui', 'sans-serif']
        }
      }
    }

<style>
  html { scroll-behavior: smooth; }
  
  body {
    background-color: #140c0e !important;
    background-image: 
      radial-gradient(ellipse 90% 60% at 50% -15%, rgba(186, 62, 42, 0.45) 0%, transparent 60%),
      radial-gradient(circle at 0% 95%, rgba(138, 51, 36, 0.35) 0%, transparent 50%),
      radial-gradient(circle at 100% 85%, rgba(0, 98, 51, 0.18) 0%, transparent 45%),
      linear-gradient(180deg, #221215 0%, #140c0e 50%, #0a0607 100%) !important;
    background-attachment: fixed;
  }

  html[lang="ar"] body { font-family: 'Cairo', sans-serif; direction: rtl; }
  html[lang="fr"] body, html[lang="en"] body { font-family: 'Inter', sans-serif; direction: ltr; }

  .font-display { font-family: 'Playfair Display', 'Cairo', serif; }
  .no-scrollbar { scrollbar-width: none; }
  .no-scrollbar::-webkit-scrollbar { display: none; }

  /* High contrast ultra-clear glass */
  .glass {
    background: rgba(45, 26, 31, 0.75);
    border: 1px solid rgba(252, 232, 160, 0.22);
    -webkit-backdrop-filter: blur(24px);
            backdrop-filter: blur(24px);
  }
  .glass-strong {
    background: rgba(32, 18, 22, 0.95);
    border: 1px solid rgba(212, 175, 55, 0.5);
    -webkit-backdrop-filter: blur(30px);
            backdrop-filter: blur(30px);
  }
  .nav-glass {
    background: rgba(20, 12, 14, 0.90);
    border-bottom: 1px solid rgba(252, 232, 160, 0.18);
    -webkit-backdrop-filter: blur(20px);
            backdrop-filter: blur(20px);
  }

  .gold-text {
    background: linear-gradient(110deg, #d4af37 0%, #fffbe8 35%, #e6c55c 65%, #fce8a0 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 2px 14px rgba(212,175,55,0.3));
  }
  .btn-gold {
    background: linear-gradient(110deg, #d4af37 0%, #fce8a0 45%, #d4af37 90%);
    color: #140c0e; font-weight: 800;
    box-shadow: 0 4px 18px rgba(212,175,55,0.35);
    transition: transform .15s ease, box-shadow .2s ease;
  }
  .btn-gold:active { transform: scale(.97); }

  button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible {
    outline: 2px solid #d4af37; outline-offset: 2px;
  }

  .lang-on { background: #d4af37; color: #140c0e; font-weight: 800; }
  .tab-on  { background: linear-gradient(110deg,#d4af37,#fce8a0); color: #140c0e; box-shadow: 0 4px 18px rgba(212,175,55,0.35); font-weight: 800; }
  .pill { border: 1px solid rgba(252,232,160,.22); color: rgba(255,255,255,.92); background: rgba(48,28,32,.75); transition: all .18s ease; font-weight: 600; }
  .pill[aria-pressed="true"] { background: rgba(212,175,55,.3); border-color: #d4af37; color: #fce8a0; font-weight: 800; }

  .dish-card { transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease; background: rgba(36, 20, 24, 0.85); border: 1px solid rgba(252,232,160,0.16); }
  .dish-card:hover { border-color: rgba(212,175,55,0.5); transform: translateY(-2px); box-shadow: 0 10px 30px rgba(0,0,0,0.4); }

  .star { transition: transform .15s ease; -webkit-tap-highlight-color: transparent; }
  .star:active { transform: scale(.85); }
  .star svg { fill: transparent; stroke: #b89c9f; transition: fill .2s, stroke .2s; }
  .star.on svg { fill: #d4af37; stroke: #d4af37; filter: drop-shadow(0 0 12px rgba(212,175,55,0.7)); }

  .chip { border: 1px solid #703c43; background: #301c20; color: rgba(255,255,255,.95); transition: all .15s ease; font-weight: 600; }
  .chip[aria-pressed="true"] { background: rgba(212,175,55,.3); border-color: #d4af37; color: #fce8a0; }

  .pop { animation: pop .35s cubic-bezier(.2,1.4,.4,1); }
  @keyframes pop { from { transform: scale(.6); } to { transform: scale(1); } }
  .fade-up { animation: fadeUp .45s ease both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  #qrBox img { max-width: 100%; height: auto; margin: 0 auto; display: block; border-radius: 0.5rem; }
</style>
</head>

<body class="min-h-screen text-white antialiased">
<div class="fixed inset-x-0 top-0 z-50 h-[3.5px]" aria-hidden="true" style="background:linear-gradient(90deg,#8a3324 0%,#d4af37 50%,#006233 100%)"></div>

<!-- HEADER -->
<header class="mx-auto flex max-w-2xl items-center justify-between px-5 pb-3 pt-[max(1.2rem,env(safe-area-inset-top))]">
  <div class="flex items-center gap-3">
    <div class="flex h-11 w-11 items-center justify-center rounded-2xl bg-gold-500/20 border border-gold-500/40 text-gold-300 shadow-lg">
      <svg viewBox="0 0 24 24" class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 13.8A4.8 4.8 0 0 1 9.2 6a5.5 5.5 0 0 1 10.6 1.5A3.8 3.8 0 0 1 20 15H6z"/>
        <path d="M6 15v5a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-5"/>
      </svg>
    </div>
  </div>

  <div id="langSwitch" class="inline-flex rounded-full border border-white/25 bg-[#2c181d]/95 p-1 text-xs backdrop-blur shadow-md" role="group" aria-label="Language">
    <button data-lang="fr" class="rounded-full px-3.5 py-1.5 transition">FR</button>
    <button data-lang="ar" class="rounded-full px-3.5 py-1.5 transition">AR</button>
  </div>
</header>

<!-- HERO SECTION -->
<section class="mx-auto max-w-2xl px-5 pb-4 pt-2 text-center fade-up">
  <h1 class="gold-text font-display text-3xl font-extrabold italic sm:text-4xl tracking-wide">Le Palais Gourmand</h1>
  <p class="mt-2 text-xs font-semibold tracking-wide text-white/95">Une cuisine authentique aux saveurs marocaines</p>
  <p class="mt-0.5 text-xs font-bold text-gold-300">مطبخ أصيل بنكهات مغربية</p>
</section>

<!-- STICKY NAV PILLS (Ordered: Desserts First, then Mains, Entrées, Drinks) -->
<div class="nav-glass sticky top-0 z-30">
  <div class="mx-auto max-w-2xl px-5 pb-2.5 pt-2">
    <div class="glass grid grid-cols-2 gap-1 rounded-full p-1 mb-2" role="tablist">
      <button id="tabBtnMenu"   role="tab" aria-selected="true"  aria-controls="panelMenu"   class="rounded-full px-4 py-2 text-xs font-bold transition" data-i18n="tabMenu"></button>
      <button id="tabBtnReview" role="tab" aria-selected="false" aria-controls="panelReview" class="rounded-full px-4 py-2 text-xs font-bold transition" data-i18n="tabReview"></button>
    </div>
    <div id="pills" class="no-scrollbar -mx-5 flex gap-2 overflow-x-auto px-5 pb-1" role="group"></div>
  </div>
</div>

<!-- MENU TAB -->
<main id="panelMenu" role="tabpanel" class="mx-auto max-w-2xl px-5 pb-28 pt-4">
  <div id="menuRoot" class="space-y-3"></div>
  <p data-i18n="nutriNote" class="mx-auto mt-8 max-w-md text-center text-[11px] leading-relaxed text-white/70 font-medium"></p>
</main>

<!-- REVIEW TAB -->
<main id="panelReview" role="tabpanel" class="mx-auto hidden max-w-xl px-5 pb-16 pt-4">
  <div id="reviewLocked" class="glass hidden rounded-3xl p-6 text-center">
    <div class="pop mx-auto mb-3 flex h-12 w-12 items-center justify-center rounded-full bg-gold-500/20 text-2xl">🙏</div>
    <h2 data-i18n="lockedTitle" class="text-lg font-bold"></h2>
    <p data-i18n="lockedText" class="mt-2 text-xs leading-relaxed text-white/80"></p>
  </div>

  <div id="reviewFlow">
    <div class="glass rounded-3xl p-4">
      <h2 data-i18n="reviewTitle" class="text-center font-display text-xl font-bold"></h2>
      <p data-i18n="reviewSub" class="mt-1 text-center text-xs text-white/85"></p>

      <label for="waiterName" data-i18n="waiterLabel" class="mt-4 block text-xs font-bold uppercase tracking-wider text-gold-300"></label>
      <input id="waiterName" type="text" maxlength="40" autocomplete="off"
             class="mt-1.5 w-full rounded-xl border border-[#703c43] bg-[#301c20] p-3 text-xs text-white placeholder:text-white/40 focus:border-gold-500 font-semibold" />

      <div id="stars" class="mt-5 flex justify-center gap-1.5" dir="ltr" role="radiogroup" aria-label="Rating"></div>
      <p id="ratingLabel" class="mt-2.5 h-5 text-center text-xs font-bold text-gold-300"></p>
    </div>

    <section id="positive" class="mt-4 hidden rounded-3xl border border-gold-500/50 bg-gradient-to-b from-gold-500/25 to-[#140c0e]/80 p-5 text-center backdrop-blur">
      <div class="pop mx-auto mb-2.5 flex h-12 w-12 items-center justify-center rounded-full bg-gold-500/30 text-2xl">🎉</div>
      <h2 data-i18n="posTitle" class="text-lg font-bold"></h2>
      <p data-i18n="posText" class="mt-1.5 text-xs leading-relaxed text-white/90"></p>
      <a id="mapsBtn" href="#" target="_blank" rel="noopener noreferrer"
         class="btn-gold mt-4 flex w-full items-center justify-center gap-2 rounded-xl px-4 py-3 text-sm font-bold">
        <svg viewBox="0 0 24 24" class="h-4 w-4" fill="currentColor" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
        <span data-i18n="mapsBtn"></span>
      </a>
    </section>

    <section id="negative" class="glass mt-4 hidden rounded-3xl p-4">
      <h2 data-i18n="negTitle" class="text-base font-bold"></h2>
      <p data-i18n="negText" class="mt-1 text-xs leading-relaxed text-white/85"></p>

      <p data-i18n="chipsLabel" class="mt-4 text-xs font-bold uppercase tracking-wider text-gold-300"></p>
      <div id="chips" class="mt-2 flex flex-wrap gap-1.5"></div>

      <label for="comment" data-i18n="commentLabel" class="mt-4 block text-xs font-bold uppercase tracking-wider text-gold-300"></label>
      <textarea id="comment" rows="3" maxlength="600"
        class="mt-1.5 w-full resize-none rounded-xl border border-[#703c43] bg-[#301c20] p-3 text-xs text-white placeholder:text-white/40 focus:border-gold-500 font-semibold"></textarea>

      <button id="waBtn" type="button"
        class="mt-4 flex w-full items-center justify-center gap-2 rounded-xl bg-[#25D366] px-4 py-3 text-sm font-extrabold text-[#140c0e] shadow-[0_6px_20px_rgba(37,211,102,.35)] transition active:scale-[.98]">
        <svg viewBox="0 0 24 24" class="h-4 w-4" fill="currentColor" aria-hidden="true"><path d="M12.04 2a9.9 9.9 0 0 0-8.47 15l-1.5 5.5 5.64-1.48A9.9 9.9 0 1 0 12.04 2zm5.8 14.1c-.25.7-1.45 1.34-2 1.4-.5.06-1.13.09-1.82-.12-.42-.13-.96-.31-1.65-.6-2.9-1.25-4.8-4.17-4.94-4.37-.14-.19-1.18-1.57-1.18-3s.75-2.13 1.02-2.42c.27-.29.58-.36.78-.36h.56c.18 0 .42-.07.65.5.25.58.84 2.02.91 2.17.07.14.12.31.02.5-.1.2-.15.31-.3.48-.14.17-.3.38-.43.51-.14.14-.29.3-.12.58.17.29.75 1.24 1.62 2.01 1.1.98 2.03 1.29 2.32 1.43.29.14.46.12.63-.07.17-.2.72-.84.91-1.13.2-.29.38-.24.65-.14.27.1 1.7.8 2 .95.29.14.48.22.55.34.07.12.07.7-.18 1.4z"/></svg>
        <span data-i18n="waBtn"></span>
      </button>
      <p data-i18n="waHint" class="mt-2.5 text-center text-[11px] text-white/65 font-medium"></p>

      <a id="publicLink" href="#" target="_blank" rel="noopener noreferrer"
         data-i18n="publicLink" class="mt-3 block text-center text-xs text-white/80 underline underline-offset-4 hover:text-gold-300"></a>
    </section>
  </div>
</main>

<!-- FOOTER -->
<footer class="mx-auto max-w-2xl px-5 pb-24 pt-4 text-center">
  <div class="mx-auto mb-2 h-px w-12 bg-gradient-to-r from-transparent via-gold-500/70 to-transparent"></div>
  <p class="text-[11px] text-white/70 font-medium">
    <span data-i18n="poweredBy"></span>
    <span class="brand-font text-[11px] text-gold-400 font-bold" dir="ltr">Ikatna</span>
  </p>
</footer>

<!-- STICKY CART BAR -->
<div id="cartBar" class="pointer-events-none fixed inset-x-0 bottom-0 z-40 translate-y-full px-3 pb-[max(.5rem,env(safe-area-inset-bottom))] transition-transform duration-300" aria-hidden="true">
  <div class="glass-strong mx-auto flex max-w-md items-center justify-between gap-2.5 rounded-2xl px-3.5 py-2 shadow-[0_-8px_30px_rgba(0,0,0,.7)]">
    <div id="cartInfo" class="min-w-0 flex-1 ps-1">
      <p id="cartCount" class="text-[10px] font-bold uppercase tracking-wider text-white/85 leading-tight"></p>
      <p id="cartTotal" class="font-display text-base font-extrabold text-gold-300 leading-tight"></p>
    </div>
    <button id="cancelBtn" type="button" class="ms-auto flex h-9 shrink-0 items-center gap-1 rounded-xl border border-white/20 bg-white/10 px-2.5 text-xs font-bold text-white transition hover:bg-white/20">
      <svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/></svg>
      <span id="cancelLabel" class="hidden"></span>
    </button>
    <button id="qrBtn" type="button" class="btn-gold flex shrink-0 items-center gap-1.5 rounded-xl px-4 py-2 text-xs font-extrabold shadow-md">
      <svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h3M20 17v4"/></svg>
      <span data-i18n="showQr"></span>
    </button>
  </div>
</div>

<!-- QR MODAL (Table Input placed right above QR code generation) -->
<div id="qrModal" class="fixed inset-0 z-50 hidden items-end justify-center bg-black/80 backdrop-blur-sm sm:items-center" role="dialog" aria-modal="true" aria-labelledby="qrTitle">
  <div class="glass-strong fade-up max-h-[92vh] w-full max-w-sm overflow-y-auto rounded-t-3xl p-5 sm:rounded-3xl shadow-2xl">
    <div class="text-center">
      <h2 id="qrTitle" data-i18n="qrTitle" class="font-display text-xl font-bold"></h2>
      <p class="mt-0.5 text-xs text-white/85 font-medium">
        <span data-i18n="refLabel">Ref:</span>
        <span id="qrRef" class="font-mono text-[11px] tracking-widest text-gold-300 font-bold" dir="ltr"></span>
      </p>
    </div>

    <!-- Table Number Configuration right before QR generation -->
    <div class="mt-4 rounded-2xl bg-[#241418] border border-gold-500/30 p-3">
      <label for="modalTableInput" data-i18n="tablePrompt" class="block text-center text-xs font-bold text-gold-300 mb-1.5"></label>
      <div class="flex gap-2">
        <input id="modalTableInput" type="text" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false" dir="ltr"
               class="min-w-0 flex-1 rounded-xl border border-gold-500/40 bg-[#301c20] p-2 text-center font-display text-base font-extrabold uppercase text-white placeholder:text-white/40 focus:border-gold-500" />
        <button id="modalTableOkBtn" type="button" data-i18n="tableOk" class="btn-gold rounded-xl px-4 text-xs font-bold"></button>
      </div>
      <p id="modalTableErr" class="mt-1 hidden text-center text-[11px] text-red-400 font-semibold" role="alert"></p>
    </div>

    <!-- QR Code Container -->
    <div class="mx-auto mt-4 w-fit rounded-2xl bg-white p-3 shadow-[0_0_35px_rgba(212,175,55,0.4)]">
      <div id="qrBox" class="flex h-[180px] w-[180px] items-center justify-center" dir="ltr"></div>
    </div>
    <p id="qrError" class="mt-2.5 hidden text-center text-xs text-amber-300 font-semibold"></p>
    <p data-i18n="qrHint" class="mt-2.5 text-center text-[11px] text-white/80 font-medium"></p>

    <ul id="qrList" class="mt-4 space-y-1.5 border-t border-white/15 pt-3 text-xs"></ul>
    <div class="mt-2.5 flex items-center justify-between border-t border-white/15 pt-2.5">
      <span data-i18n="total" class="text-xs font-bold text-white/90"></span>
      <span id="qrTotal" class="font-display text-base font-extrabold text-gold-300"></span>
    </div>

    <button id="qrCancel" type="button"
      class="mt-4 w-full rounded-xl border border-red-400/40 bg-red-500/15 px-4 py-3 text-xs font-bold text-red-200 transition hover:bg-red-500/25"></button>
    <button id="qrClose" type="button" data-i18n="close"
      class="mt-2.5 w-full rounded-xl border border-white/20 bg-white/10 px-4 py-3 text-xs font-bold transition hover:bg-white/20"></button>
  </div>
</div>

  const state = {
    lang: 'fr',
    tab: 'menu',
    cat: 'all',
    table: '',
    cart: {},
    rating: 0,
    hoverRating: 0,
    chips: new Set(),
    cancelArmed: false
  };

  const t = () => I18N[state.lang];

  function initTable() {
    try {
      const saved = localStorage.getItem('ikatna_table');
      if (saved) state.table = saved;
    } catch (_) {}
  }

  function setTable(val) {
    const clean = (val || '').trim().toUpperCase().replace(/[^A-Z0-9_-]/g, '').slice(0, 6);
    state.table = clean;
    try { localStorage.setItem('ikatna_table', clean); } catch (_) {}
    openQrModal(); // Refresh QR with table info
  }

  function getReviewLockKey() {
    return 'ikatna_reviewed_' + (state.table || 'GEN');
  }

  function checkReviewLock() {
    try {
      const raw = localStorage.getItem(getReviewLockKey());
      if (raw) {
        const ts = parseInt(raw, 10);
        const hours = (Date.now() - ts) / (1000 * 60 * 60);
        if (hours < CONFIG.reviewLockHours) return true;
      }
    } catch (_) {}
    return false;
  }

  function setReviewLock() {
    try { localStorage.setItem(getReviewLockKey(), String(Date.now())); } catch (_) {}
  }

  function updateReviewLockUI() {
    const locked = checkReviewLock();
    const lockedBox = document.getElementById('reviewLocked');
    const flowBox = document.getElementById('reviewFlow');
    if (lockedBox && flowBox) {
      lockedBox.classList.toggle('hidden', !locked);
      flowBox.classList.toggle('hidden', locked);
    }
  }

  function applyLanguage(lang) {
    if (!I18N[lang]) return;
    state.lang = lang;
    const L = I18N[lang];

    document.documentElement.lang = L.lang;
    document.documentElement.dir = L.dir;

    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (L[key]) el.textContent = L[key];
    });

    document.querySelectorAll('#langSwitch button').forEach(b => {
      const active = b.getAttribute('data-lang') === lang;
      b.classList.toggle('lang-on', active);
      b.classList.toggle('text-white/80', !active);
    });

    const cancelLbl = document.getElementById('cancelLabel');
    if (cancelLbl) cancelLbl.textContent = L.cancelOrder;

    const modalInp = document.getElementById('modalTableInput');
    if (modalInp) modalInp.placeholder = state.table || '01';

    renderPills();
    renderMenu();
    renderChips();
    paintStars();
    updateCartBar();
  }

  function switchTab(tab) {
    state.tab = tab;
    const isMenu = tab === 'menu';
    const menuP = document.getElementById('panelMenu');
    const revP = document.getElementById('panelReview');
    const btnM = document.getElementById('tabBtnMenu');
    const btnR = document.getElementById('tabBtnReview');

    if (menuP) menuP.classList.toggle('hidden', !isMenu);
    if (revP) revP.classList.toggle('hidden', isMenu);

    if (btnM) {
      btnM.setAttribute('aria-selected', isMenu ? 'true' : 'false');
      btnM.className = `rounded-full px-4 py-2 text-xs font-bold transition ${isMenu ? 'tab-on' : 'text-white/85 hover:text-white'}`;
    }
    if (btnR) {
      btnR.setAttribute('aria-selected', !isMenu ? 'true' : 'false');
      btnR.className = `rounded-full px-4 py-2 text-xs font-bold transition ${!isMenu ? 'tab-on' : 'text-white/85 hover:text-white'}`;
    }

    updateCartBar();
    if (!isMenu) updateReviewLockUI();
  }

  function renderPills() {
    const wrap = document.getElementById('pills');
    if (!wrap) return;
    wrap.innerHTML = '';
    const cats = t().categories;

    Object.keys(cats).forEach(key => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'pill rounded-full px-4 py-2 text-xs font-semibold whitespace-nowrap shadow-sm';
      btn.textContent = cats[key];
      const active = state.cat === key;
      btn.setAttribute('aria-pressed', active ? 'true' : 'false');
      btn.onclick = () => {
        state.cat = key;
        renderPills();
        renderMenu();
      };
      wrap.appendChild(btn);
    });
  }

  function renderMenu() {
    const root = document.getElementById('menuRoot');
    if (!root) return;
    root.innerHTML = '';

    const list = MENU.filter(item => state.cat === 'all' || item.cat === state.cat);
    const L = t();

    if (list.length === 0) {
      root.innerHTML = '<p class="py-16 text-center text-xs text-white/60">Aucun plat trouvé.</p>';
      return;
    }

    list.forEach(item => {
      const data = item[state.lang] || item.fr || item.en;
      const qty = state.cart[item.id] || 0;

      const card = document.createElement('div');
      card.className = 'dish-card flex items-center justify-between gap-3 p-3.5 rounded-2xl shadow-md';

      const imgHtml = `
        <div class="relative h-20 w-20 shrink-0 overflow-hidden rounded-xl bg-[#241418]">
          <img src="${IMG(item.img)}" alt="${escapeHtml(data.name)}" loading="lazy"
               class="h-full w-full object-cover"
               onerror="this.style.display='none';" />
        </div>
      `;

      let actionHtml = '';
      if (qty === 0) {
        actionHtml = `
          <button type="button" onclick="window.__ikatna.add('${item.id}', 1)"
                  class="btn-gold rounded-xl px-3 py-1.5 text-xs font-bold flex items-center gap-1">
            <span>+</span>
            <span>${item.price} ${CONFIG.currencyCode}</span>
          </button>
        `;
      } else {
        actionHtml = `
          <div class="flex items-center gap-1.5 rounded-xl border border-gold-500/60 bg-gold-500/25 p-1">
            <button type="button" onclick="window.__ikatna.add('${item.id}', -1)"
                    class="flex h-6 w-6 items-center justify-center rounded-lg bg-white/15 text-xs font-bold text-gold-300" aria-label="Decrease">-</button>
            <span class="font-display text-xs font-extrabold text-gold-300 px-1" dir="ltr">${qty}</span>
            <button type="button" onclick="window.__ikatna.add('${item.id}', 1)"
                    class="flex h-6 w-6 items-center justify-center rounded-lg bg-white/15 text-xs font-bold text-gold-300" aria-label="Increase">+</button>
          </div>
        `;
      }

      card.innerHTML = `
        <div class="flex items-center gap-3 min-w-0 flex-1">
          ${imgHtml}
          <div class="min-w-0 flex-1">
            <h3 class="font-display text-sm font-bold text-white truncate">${escapeHtml(data.name)}</h3>
            <p class="mt-0.5 text-[11px] text-white/80 line-clamp-1 font-medium">${escapeHtml(data.desc)}</p>
            <div class="mt-2 flex items-center gap-3 text-[11px] text-gold-300 font-bold">
              <span class="inline-flex items-center gap-1">🔥 ${item.kcal} ${L.kcal}</span>
              <span class="inline-flex items-center gap-1">🥩 ${item.protein}${L.protein}</span>
            </div>
          </div>
        </div>
        <div class="flex flex-col items-end justify-between gap-2 shrink-0">
          <span class="rounded-full bg-gold-500/25 px-3 py-1 font-display text-xs font-extrabold text-gold-300 border border-gold-500/40">
            +${item.price} ${CONFIG.currencyCode}
          </span>
          ${actionHtml}
        </div>
      `;
      root.appendChild(card);
    });
  }

  function getCartSummary() {
    let totalQty = 0;
    let totalPrice = 0;
    const items = [];

    Object.keys(state.cart).forEach(id => {
      const q = state.cart[id];
      if (q > 0) {
        const item = MENU.find(m => m.id === id);
        if (item) {
          totalQty += q;
          totalPrice += item.price * q;
          items.push({ item, qty: q, sub: item.price * q });
        }
      }
    });
    return { totalQty, totalPrice, items };
  }

  function updateCartBar() {
    const bar = document.getElementById('cartBar');
    if (!bar) return;
    const { totalQty, totalPrice } = getCartSummary();
    const show = (totalQty > 0 && state.tab === 'menu');

    bar.classList.toggle('translate-y-full', !show);
    bar.classList.toggle('pointer-events-none', !show);
    bar.setAttribute('aria-hidden', show ? 'false' : 'true');

    if (show) {
      const countEl = document.getElementById('cartCount');
      const totalEl = document.getElementById('cartTotal');
      if (countEl) countEl.textContent = `${totalQty} ${totalQty === 1 ? 'article' : 'articles'}`;
      if (totalEl) totalEl.textContent = `${totalPrice} ${CONFIG.currencyCode}`;
    }
  }

  function modifyQty(id, delta) {
    const cur = state.cart[id] || 0;
    const next = cur + delta;
    if (next <= 0) delete state.cart[id];
    else state.cart[id] = next;
    state.cancelArmed = false;
    updateCancelButtonUI();
    renderMenu();
    updateCartBar();
  }

  function updateCancelButtonUI() {
    const btn = document.getElementById('cancelBtn');
    if (!btn) return;
    if (state.cancelArmed) {
      btn.className = 'ms-auto flex h-9 shrink-0 items-center gap-1 rounded-xl border border-red-500 bg-red-500/25 px-2.5 text-[11px] font-bold text-red-200 transition';
    } else {
      btn.className = 'ms-auto flex h-9 shrink-0 items-center gap-1 rounded-xl border border-white/20 bg-white/10 px-2.5 text-xs font-bold text-white transition hover:bg-white/20';
    }
  }

  function clearCart() {
    state.cart = {};
    state.cancelArmed = false;
    updateCancelButtonUI();
    renderMenu();
    updateCartBar();
    closeQrModal();
  }

  function openQrModal() {
    const { totalQty, totalPrice, items } = getCartSummary();
    if (totalQty === 0) return;

    const modal = document.getElementById('qrModal');
    if (modal) {
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    const modalInp = document.getElementById('modalTableInput');
    if (modalInp) modalInp.value = state.table || '';

    const refStr = 'ORD-' + Math.random().toString(36).substring(2, 8).toUpperCase();
    const qrRefEl = document.getElementById('qrRef');
    if (qrRefEl) qrRefEl.textContent = refStr;

    const listEl = document.getElementById('qrList');
    if (listEl) {
      listEl.innerHTML = items.map(({ item, qty, sub }) => `
        <li class="flex justify-between items-center py-1">
          <span class="text-white/95 font-medium"><strong>${qty}x</strong> ${escapeHtml(item.nameFr)}</span>
          <span class="font-bold text-gold-300" dir="ltr">+${sub} ${CONFIG.currencyCode}</span>
        </li>
      `).join('');
    }

    const totalValEl = document.getElementById('qrTotal');
    if (totalValEl) totalValEl.textContent = `${totalPrice} ${CONFIG.currencyCode}`;

    const cancelBtn = document.getElementById('qrCancel');
    if (cancelBtn) cancelBtn.textContent = t().cancelOrder;

    const tableStr = state.table ? 'Table: #' + state.table : 'Table: Unassigned';
    const lines = [
      `IKATNA ORDER`,
      tableStr,
      `REF: ${refStr}`,
      `---`
    ];
    items.forEach(({ item, qty }) => {
      lines.push(`${qty}x ${item.nameFr} (+${item.price * qty} ${CONFIG.currencyCode})`);
    });
    lines.push(`---`);
    lines.push(`TOTAL: ${totalPrice} ${CONFIG.currencyCode}`);

    const box = document.getElementById('qrBox');
    const errEl = document.getElementById('qrError');
    if (box) {
      box.innerHTML = '';
      if (errEl) errEl.classList.add('hidden');
      
      const qrText = encodeURIComponent(lines.join('\n'));
      const qrImageUrl = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${qrText}`;
      
      const img = document.createElement('img');
      img.src = qrImageUrl;
      img.alt = 'Order QR Code';
      img.onerror = () => {
        if (errEl) {
          errEl.textContent = 'Erreur de génération QR.';
          errEl.classList.remove('hidden');
        }
      };
      box.appendChild(img);
    }
  }

  function closeQrModal() {
    const modal = document.getElementById('qrModal');
    if (modal) {
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }
  }

  function initReview() {
    const starsEl = document.getElementById('stars');
    if (!starsEl) return;
    starsEl.innerHTML = '';

    const starSvg = '<svg viewBox="0 0 24 24" class="h-10 w-10 sm:h-11 sm:w-11" stroke-width="1.6" stroke-linejoin="round"><path d="M12 2.5l2.9 6.1 6.6.9-4.8 4.6 1.2 6.6L12 17.5l-5.9 3.2 1.2-6.6L2.5 9.5l6.6-.9L12 2.5z"/></svg>';

    for (let i = 1; i <= 5; i++) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'star p-1';
      b.setAttribute('role', 'radio');
      b.setAttribute('aria-checked', 'false');
      b.setAttribute('aria-label', String(i));
      b.innerHTML = starSvg;

      b.onclick = () => setRating(i);
      b.onmouseenter = () => { state.hoverRating = i; paintStars(); };
      b.onmouseleave = () => { state.hoverRating = 0; paintStars(); };
      starsEl.appendChild(b);
    }

    renderChips();
    paintStars();
    updateReviewSections();
  }

  function paintStars() {
    const active = state.hoverRating || state.rating;
    const starsEl = document.getElementById('stars');
    if (!starsEl) return;

    [...starsEl.children].forEach((b, idx) => {
      const val = idx + 1;
      const on = val <= active;
      b.classList.toggle('on', on);
      b.setAttribute('aria-checked', state.rating === val ? 'true' : 'false');
    });

    const lbl = document.getElementById('ratingLabel');
    if (lbl) {
      lbl.textContent = active ? (t().ratings[active] || '') : '';
    }
  }

  function setRating(n) {
    state.rating = n;
    paintStars();
    updateReviewSections();
    setReviewLock();
  }

  function updateReviewSections() {
    const pos = document.getElementById('positive');
    const neg = document.getElementById('negative');
    const r = state.rating;

    if (pos) pos.classList.toggle('hidden', r < 4);
    if (neg) {
      neg.classList.toggle('hidden', !(r >= 1 && r <= 3));
    }
  }

  function renderChips() {
    const wrap = document.getElementById('chips');
    if (!wrap) return;
    wrap.innerHTML = '';
    const chipKeys = t().chips;

    Object.keys(chipKeys).forEach(key => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'chip rounded-full px-3 py-1.5 text-[11px] font-semibold';
      btn.textContent = chipKeys[key];
      const active = state.chips.has(key);
      btn.setAttribute('aria-pressed', active ? 'true' : 'false');
      btn.onclick = () => {
        if (state.chips.has(key)) state.chips.delete(key);
        else state.chips.add(key);
        btn.setAttribute('aria-pressed', state.chips.has(key) ? 'true' : 'false');
      };
      wrap.appendChild(btn);
    });
  }

  function buildWhatsAppUrl() {
    const L = t();
    const tableVal = state.table || 'N/A';
    const waiterVal = (document.getElementById('waiterName').value || '').trim() || 'Non spécifié';
    const commentVal = (document.getElementById('comment').value || '').trim() || 'Aucun';
    const issues = [...state.chips].map(k => '• ' + (L.chips[k] || k)).join('\n') || 'Aucun';

    const lines = [
      '🚨 Nouvel avis client (Le Palais Gourmand):',
      ``,
      `🪑 Table: #${tableVal}`,
      `👤 Serveur: ${waiterVal}`,
      `⭐ Note: ${state.rating}/5`,
      `⚠️ Problèmes:`,
      issues,
      `💬 Commentaire: ${commentVal}`
    ];

    return 'https://wa.me/' + CONFIG.whatsappNumber + '?text=' + encodeURIComponent(lines.join('\n'));
  }

  function escapeHtml(str) {
    return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('#langSwitch button').forEach(b => {
      b.onclick = () => applyLanguage(b.getAttribute('data-lang'));
    });

    const btnM = document.getElementById('tabBtnMenu');
    const btnR = document.getElementById('tabBtnReview');
    if (btnM) btnM.onclick = () => switchTab('menu');
    if (btnR) btnR.onclick = () => switchTab('review');

    const qrBtn = document.getElementById('qrBtn');
    if (qrBtn) qrBtn.onclick = openQrModal;

    const modalTableOkBtn = document.getElementById('modalTableOkBtn');
    const modalTableInput = document.getElementById('modalTableInput');
    if (modalTableOkBtn && modalTableInput) {
      modalTableOkBtn.onclick = () => setTable(modalTableInput.value);
      modalTableInput.onkeydown = (e) => { if (e.key === 'Enter') setTable(modalTableInput.value); };
    }

    const cancelBtn = document.getElementById('cancelBtn');
    if (cancelBtn) {
      cancelBtn.onclick = () => {
        if (!state.cancelArmed) {
          state.cancelArmed = true;
          updateCancelButtonUI();
          setTimeout(() => {
            if (state.cancelArmed) {
              state.cancelArmed = false;
              updateCancelButtonUI();
            }
          }, 4000);
        } else {
          clearCart();
        }
      };
    }

    const qrClose = document.getElementById('qrClose');
    if (qrClose) qrClose.onclick = closeQrModal;

    const qrCancel = document.getElementById('qrCancel');
    if (qrCancel) qrCancel.onclick = clearCart;

    const qrModal = document.getElementById('qrModal');
    if (qrModal) {
      qrModal.onclick = (e) => {
        if (e.target === qrModal) closeQrModal();
      };
    }

    const mapsBtn = document.getElementById('mapsBtn');
    if (mapsBtn) mapsBtn.href = CONFIG.googleMapsReviewUrl;

    const publicLink = document.getElementById('publicLink');
    if (publicLink) publicLink.href = CONFIG.googleMapsReviewUrl;

    const waBtn = document.getElementById('waBtn');
    if (waBtn) {
      waBtn.onclick = () => {
        const url = buildWhatsAppUrl();
        window.open(url, '_blank', 'noopener');
        setReviewLock();
        updateReviewLockUI();
      };
    }

    window.__ikatna = {
      add: (id, delta) => modifyQty(id, delta)
    };

    initTable();
    applyLanguage('fr');
    initReview();
  });

})();
</script>
</body>
</html>
